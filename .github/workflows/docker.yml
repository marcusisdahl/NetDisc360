# Publishes the Docker image to ghcr.io/marcusisdahl/netdisc360:
# - when a release is published: tagged with its version and latest, with that
#   release's launchers (NetISO-Sync.zip, which must be attached before the
#   release is published). It can also be run by hand for an existing release
#   tag.
# - on every push to the dev branch: tagged dev (and dev-<commit>), for
#   testing what will be in the next release. It uses the latest release's
#   launchers.
name: Docker image

on:
  release:
    types: [published]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (its NetISO-Sync.zip is used)
        required: true

permissions:
  contents: read
  packages: write

# A newer push to dev replaces a dev build still running; releases always finish.
concurrency:
  group: docker-${{ github.event_name == 'push' && 'dev' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  DEV: ${{ github.event_name == 'push' }}
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV == 'true' && github.sha || env.TAG }}
      - name: Check the tag matches server/version.h
        if: env.DEV != 'true'
        run: |
          grep -q "NETDISC_VERSION \"${TAG#v}\"" server/version.h || {
            echo "::error::Tag $TAG doesn't match NETDISC_VERSION in server/version.h; set the version there before tagging."
            exit 1
          }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marcusisdahl/netdisc360
          # A release gets its version and latest; a test version
          # (v1.2.0-beta.1) isn't "latest". The dev branch gets dev and
          # dev-<commit>, never latest.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ env.DEV != 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.DEV != 'true' }}
            type=raw,value=latest,enable=${{ env.DEV != 'true' && !contains(env.TAG, '-') }}
            type=raw,value=dev,enable=${{ env.DEV == 'true' }}
            type=sha,prefix=dev-,enable=${{ env.DEV == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LAUNCHER_URL=https://github.com/${{ github.repository }}/releases/${{ env.DEV == 'true' && 'latest/download' || format('download/{0}', env.TAG) }}/NetISO-Sync.zip
            REQUIRE_LAUNCHER=1
