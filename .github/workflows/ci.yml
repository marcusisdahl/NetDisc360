# Runs the Linux tests and builds the Docker image on every push and pull
# request. The Xbox and Windows builds need the Xbox 360 SDK, so they are
# made on a PC with build.ps1.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The dashboard page is built into the server
        run: python3 tools/make_web.py --check
      - name: Server, discs, Sync and generator tests
        run: |
          python3 tests/test_server.py
          python3 tests/test_discs.py
          python3 tests/test_sync.py
          python3 tests/test_generator.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: netdisc-360:ci
