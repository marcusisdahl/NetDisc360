# Runs the Linux tests, compiles the Windows server and builds the Docker
# image on every push and pull request. The Xbox builds (and the release exe,
# which carries them) need the Xbox 360 SDK, so they are made on a PC with
# build.ps1.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The dashboard page, made into server/web_page.h (not kept in git)
        run: python3 tools/make_web.py
      - name: The System Link list is built into the server
        run: python3 tools/make_systemlink.py --check
      - name: Lua for running NetDisc360's Aurora scripts in the tests
        run: python3 -m pip install --quiet lupa
      - name: Server, discs, Sync and generator tests
        run: python3 tests/run_ci.py
      - name: The sync Worker's tests (sync/)
        run: node --test sync/test/*.test.js

  # The release exe is built with MSVC on a PC (build.ps1). This builds the
  # same server with MinGW, without the launchers, so Windows-only code
  # (the tray icon, the updater) can't break unnoticed between releases.
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64-x86-64-posix
      - name: The dashboard page, made into server/web_page.h (not kept in git)
        run: python3 tools/make_web.py
      - name: The Windows server compiles and links
        run: |
          x86_64-w64-mingw32-g++-posix -std=c++14 -O1 -DNDEBUG -D_CRT_SECURE_NO_WARNINGS -D_WINSOCK_DEPRECATED_NO_WARNINGS \
            -o NetDisc360-check.exe server/main.cpp server/tray.cpp server/web.cpp server/config.cpp server/discs.cpp \
            server/discmap.cpp server/xefu.cpp server/ftp.cpp server/backup.cpp server/update.cpp server/installed.cpp server/aurora.cpp server/auroradb.cpp server/titleupdates.cpp \
            server/system.cpp server/saves.cpp server/wake.cpp server/party.cpp server/guests.cpp server/picture.cpp server/systemlink.cpp server/relay.cpp server/users.cpp server/http.cpp server/sync.cpp server/health.cpp server/compress.cpp server/codecs.cpp shared/isvr.cpp shared/library.cpp \
            -static -lws2_32 -lwinhttp -liphlpapi -lbcrypt -lcrypt32 -lshell32 -lole32 -luuid -luser32 -lgdi32 -lcomctl32 -ladvapi32

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: netdisc360:ci
          # With the latest release's launchers, as the published image needs.
          build-args: |
            REQUIRE_LAUNCHER=1
