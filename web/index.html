// The bandwidth chart: each console's last two minutes, stacked.
function bandwidthChart(wrap) {
  const canvas = h('canvas'), tip = h('div.chart-tip.hidden');
  wrap.append(canvas, tip);
  let hover = -1, series = [];
  const chart = {
    set(list) { series = list; chart.draw(); },
    draw() {
      const w = wrap.clientWidth, hgt = wrap.clientHeight, ratio = devicePixelRatio || 1;
      if (!w) return;
      canvas.width = w * ratio; canvas.height = hgt * ratio;
      const g = canvas.getContext('2d');
      g.scale(ratio, ratio);
      const n = 120, left = 64, right = 8, top = 10, bottom = 22;
      const totals = new Array(n).fill(0);
      for (const s of series) s.values.forEach((v, i) => totals[i + n - s.values.length] += v);
      const peak = Math.max(...totals, 0);
      const mb = 1048576;
      let step = [0.5, 1, 2, 5, 10, 20, 50, 100, 200].find(x => x * mb * 4 >= peak) || 500;
      const max = step * mb * 4;
      const font = '12px ' + getComputedStyle(document.body).fontFamily;
      g.font = font; g.textBaseline = 'middle';
      for (let i = 0; i <= 4; i++) {
        const y = top + (hgt - top - bottom) * (1 - i / 4);
        g.strokeStyle = css('--chart-grid'); g.lineWidth = 1;
        g.beginPath(); g.moveTo(left, Math.round(y) + .5); g.lineTo(w - right, Math.round(y) + .5); g.stroke();
        g.fillStyle = css('--faint'); g.textAlign = 'right';
        g.fillText((step * i) + (i ? ' MB/s' : ''), left - 8, y);
      }
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.fillText('2 min ago', left, hgt - 4);
      g.textAlign = 'right'; g.fillText('now', w - right, hgt - 4);
      const x = i => left + (w - left - right) * i / (n - 1);
      const y = v => top + (hgt - top - bottom) * (1 - Math.min(v, max) / max);
      const base = new Array(n).fill(0);
      series.forEach((s, k) => {
        const values = new Array(n - s.values.length).fill(0).concat(s.values);
        const color = seriesColor(s.color);
        const tops = values.map((v, i) => base[i] + v);
        g.beginPath();
        tops.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v)));
        for (let i = n - 1; i >= 0; i--) g.lineTo(x(i), y(base[i]));
        g.closePath();
        g.globalAlpha = 0.22; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
        g.beginPath();
        tops.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v)));
        g.strokeStyle = color; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
        tops.forEach((v, i) => base[i] = v);
      });
      if (!series.length || peak === 0) {
        g.fillStyle = css('--panel');
        const text = series.length ? 'Nothing is streaming right now' : 'No console has connected yet';
        const tw = g.measureText(text).width;
        g.fillRect((left + w) / 2 - tw / 2 - 10, (top + hgt - bottom) / 2 - 12, tw + 20, 24);
        g.fillStyle = css('--muted'); g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(text, (left + w) / 2, (top + hgt - bottom) / 2);
      }
      if (hover >= 0 && series.length) {
        g.strokeStyle = css('--line-strong'); g.lineWidth = 1;
        g.beginPath(); g.moveTo(Math.round(x(hover)) + .5, top); g.lineTo(Math.round(x(hover)) + .5, hgt - bottom); g.stroke();
        const rows = series.map(s => { const v = s.values[hover - (n - s.values.length)] || 0; return h('div.row', h('i', { style: { width: '8px', height: '8px', borderRadius: '2px', background: seriesColor(s.color), display: 'inline-block' } }), s.name, h('b', rate(v))); });
        fill(tip, h('div.muted', { style: { marginBottom: '4px' } }, (n - 1 - hover) ? (n - 1 - hover) + ' s ago' : 'now'), rows);
        tip.classList.remove('hidden');
        const tx = x(hover) + 14;
        tip.style.left = (tx + 170 > w ? x(hover) - 14 - tip.offsetWidth : tx) + 'px';
        tip.style.top = '10px';
      } else tip.classList.add('hidden');
      chart.x = x; chart.n = n; chart.left = left; chart.right = right;
    },
  };
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect(), w = r.width;
    const i = Math.round((e.clientX - r.left - 64) / (w - 72) * 119);
    hover = i >= 0 && i < 120 ? i : -1; chart.draw();
  });
  canvas.addEventListener('mouseleave', () => { hover = -1; chart.draw(); });
  charts.push(chart);
  return chart;
}
// A console's small chart: its last minute.
function spark(canvas, values, color) {
  const w = canvas.clientWidth || 110, hgt = canvas.clientHeight || 30, ratio = devicePixelRatio || 1;
  canvas.width = w * ratio; canvas.height = hgt * ratio;
  const g = canvas.getContext('2d'); g.scale(ratio, ratio);
  const v = values.slice(-60), max = Math.max(...v, 1048576);
  g.beginPath();
  v.forEach((x, i) => { const px = w * i / Math.max(v.length - 1, 1), py = hgt - 2 - (hgt - 4) * x / max; i ? g.lineTo(px, py) : g.moveTo(px, py); });

}

// Consoles, as the dashboard and the consoles page show them.
function consoleStatus(c) {
  // offline: it answered the server's pings, then stopped, and its connection ended.
  if (c.offline) return { cls: 'off', dot: 'bad', text: 'Offline' };
  // playing: the server saw no return to Aurora since the game's mount (its FTP server answers again).
  if (c.playing) return { cls: 'playing', dot: 'play', text: 'Playing' };
  if (c.connections > 0) return { cls: 'on', dot: 'good', text: c.inAurora || !c.mounted ? 'In Aurora' : 'Connected' };
  if (c.answers) return { cls: '', dot: 'good', text: 'On' };
  const seen = lastSeen(c);
  if (S.time - seen < 120) return { cls: '', dot: '', text: 'Idle' };
  return { cls: 'off', dot: '', text: seen ? 'Last seen ' + ago(seen) : 'Not seen yet' };
}
// seen: its latest NetISO request; answered: its latest answer to a ping.
const lastSeen = c => Math.max(c.seen, c.answered || 0);
function ftpText(c) {
  if (!c.push) return ['Not updated (not in your list)', ''];
  if (!S.settings.push) return ['Off in Settings', ''];
  if (c.offline) return ['\u2014', ''];
  if (c.ftp === 2) return ['Answers', 'good'];
  if (c.ftp === 1) return ['Not answering', c.connections > 0 ? 'warn' : ''];
  return ['Not tried yet', ''];
}
function pingText(c) {
  if (c.offline) return ['No answer', 'bad'];
  if (c.answers) return [c.ping < 1 ? 'Under 1 ms' : c.ping + ' ms', 'good'];
  return [c.ping < 0 ? '\u2014' : 'No answer', ''];
}
// A console by the name it was given on the Xbox (Settings, System, Console
// Settings, Console Name), or its address while that isn't known.
const cName = c => c.name || c.address;
const nameOf = ip => { const c = S && S.consoles.find(x => x.address === ip); return c ? cName(c) : ip; };
// The server's text, with the consoles' names for their addresses.

}

// Plugins: Set up this console. Its launch.ini's plugin lines become the
// plugins chosen here (the standard set to start with); a plugin it lacks is
// copied from the kit folder, launch.ini is backed up first, and a backup
// can be put back.
ConsoleParts.plugins = (body, address) => {
  const now = h('div'), setup = h('div'), backups = h('div');
  body.append(h('div.stack', now, setup, backups));
  let info = null, chosen = null, plan = null, done = null, error = '', loading = false, c = null, shown = '';
  const key = n => n.toLowerCase();
  async function load() {
    loading = true; error = ''; draw();
    try {
      info = await api('console/setup?address=' + encodeURIComponent(address));
      if (!chosen) chosen = standard();
      plan = null;
    } catch (e) { error = e.message; }
    loading = false; draw();
  }
  // Where each plugin would come from: the console (found), the kit folder, or nowhere.
  function source(name) {
    const there = info.plugins.find(p => key(p.name) === key(name));
    if (there && there.found) return { from: 'console', text: 'On the console: ' + there.path };
    if (info.kitFiles.some(f => key(f) === key(name))) return { from: 'kit', text: 'Copied from the kit folder' + (there ? ' (' + there.path + ' is missing)' : '') };
    return { from: '', text: there ? 'Missing: ' + there.path + ', and not in the kit folder' : info.kit ? 'Not on the console, and not in the kit folder' : 'Not on the console; no kit folder set' };
  }
  const usable = name => source(name).from !== '';
  function standard() { return info.set.filter(usable).slice(0, 5); }
  const current = () => info.plugins.map(p => p.name).slice(0, 5);
  function candidates() {
    const all = [];
    for (const n of info.set.concat(info.plugins.map(p => p.name), info.kitFiles)) if (!all.some(x => key(x) === key(n))) all.push(n);
    return all;
  }
  function choose(list) { chosen = list; plan = null; done = null; draw(); }
  async function preview(button) {
    button.disabled = true;
    try { plan = await api('console/setup', { address, plugins: chosen }); done = null; }
    catch (e) { toast(e.message, true); }
    button.disabled = false; draw();
  }
  async function apply(button) {
    if (!(await confirmBox('Set up ' + cName(c) + '?', [h('p', { style: { marginTop: 0 } }, 'NetDisc360 backs up its launch.ini first (on the console and on this PC), ' + (plan.copies.length ? 'copies ' + plural(plan.copies.length, 'file') + ', ' : '') + 'and writes the new launch.ini.'),
      h('p', { style: { marginBottom: 0 } }, 'DashLaunch loads plugins as the console starts, so restart it afterwards.')], 'Set it up'))) return;
    button.disabled = true;
    try {
      done = await api('console/setup', { address, plugins: chosen, apply: true, base: plan.base });

// The lines of a and b, as one list: kept, removed (del) and added (add).
function diffLines(a, b) {
  const n = a.length, m = b.length, len = [];
  for (let i = n; i >= 0; i--) { len[i] = []; for (let j = m; j >= 0; j--) len[i][j] = i === n || j === m ? 0 : a[i] === b[j] ? len[i + 1][j + 1] + 1 : Math.max(len[i + 1][j], len[i][j + 1]); }
  const out = [];
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { out.push({ t: 'same', s: a[i] }); i++; j++; }
    else if (j < m && (i === n || len[i][j + 1] >= len[i + 1][j])) out.push({ t: 'add', s: b[j++] });
    else out.push({ t: 'del', s: a[i++] });
  }
  while (out.length && out[out.length - 1].t === 'same' && out[out.length - 1].s === '') out.pop();
  return out;
}

// Check my setup: this computer, then each console, and a report of it all
// that leaves out addresses, names and passwords, to share when asking for help.
const NewIssue = 'https://github.com/marcusisdahl/NetDisc360/issues/new';
function scrub(text) {
  let out = text.replace(/\b\d{1,3}(\.\d{1,3}){3}\b/g, 'x.x.x.x').replace(/([A-Za-z]:\\Users\\)[^\\\s]+/gi, '$1(user)').replace(/(\/home\/)[^/\s]+/g, '$1(user)');
  for (const secret of [S.settings.ftpUser, S.settings.auroraWebUser]) if (secret && secret.length > 2) out = out.split(secret).join('(user)');
  return out;
}
function serverChecks(r) {
  const out = [];
  const kinds = [r.iso && plural(r.iso, 'ISO'), r.god && plural(r.god, 'Games on Demand package'), r.extracted && plural(r.extracted, 'extracted game')].filter(Boolean).join(', ');
  if (!r.folders) out.push(wzCheck('bad', 'No game folder yet', 'Add the folder with your games on the Game folders page.'));
  else if (r.foldersFound < r.folders) out.push(wzCheck('warn', plural(r.folders - r.foldersFound, 'game folder') + ' can\u2019t be opened', 'A drive or share that isn\u2019t connected? Until it\u2019s back, no game is removed from the consoles.'));
  else out.push(wzCheck(r.games ? 'good' : 'warn', plural(r.games, 'game') + ' in ' + plural(r.folders, 'folder'), kinds || 'Put ISOs, extracted games or Games on Demand packages there.'));
  if (r.conflicts) out.push(wzCheck('warn', plural(r.conflicts, 'game is', 'games are') + ' in your folders more than once', 'Choose which copy to play on the Games page.'));
  if (r.publicNetwork) {
    const fix = r.canFix ? h('button.btn.small', { style: { marginTop: '6px' }, onclick: async e => {
      e.currentTarget.disabled = true;
      try { await api('network/private', {}); toast('Answer Windows\u2019 prompt on this PC, then check again'); } catch (x) { toast(x.message, true); }
    } }, ic('shield-alert', 'sm'), 'Make it Private') : null;
    out.push(wzCheck('bad', 'Windows treats this network as Public', [h('div', 'Its firewall keeps the consoles out. Make it Private if it\u2019s your home network (Windows Settings, Network, your connection, Network profile type).'), fix]));
  } else if (r.networks.length) out.push(wzCheck('good', 'Windows treats this network as ' + (r.networks.includes('domain') ? 'a domain network' : 'Private')));
  if (!r.canPush) out.push(wzCheck('info', 'This build has no launcher built in', 'It serves games, but doesn\u2019t add them to Aurora.'));
  else if (!r.push) out.push(wzCheck('info', 'Adding games to Aurora is off', 'Turn it on under Settings, Xbox & Aurora.'));
  for (const w of r.warnings) out.push(wzCheck('warn', 'Lately: ' + w));
  return out;
}

// Aurora looks a game up online only once, when it first adds the tile. A
// tile whose lookup failed gets a new one when the server renames its folder

  button.disabled = true;

  try { found = await api('consoles/art', { address }); }
  catch (e) { toast(e.message, true); return; }
  finally { button.disabled = false; fill(button, ic('image', 'sm'), 'Fix missing art'); }
  if (!found.tiles.length) { toast('Every game in Aurora on ' + address + ' has its cover.'); return; }
  modal(plural(found.tiles.length, 'game') + ' without a cover', close => {
    const go = h('button.btn.primary', { onclick: async () => {
      go.disabled = true;
      try {
        const done = await api('consoles/art', { address, repair: true });
        if (done.error) toast(done.error, true);
        if (done.renamed.length) toast('Aurora is fetching the art for ' + plural(done.renamed.length, 'game') + '. It shows in about a minute.');
        close();

    } }, ic('image', 'sm'), 'Fetch the art again');

        h('p.muted', { style: { marginBottom: 0 } }, 'NetDisc360 renames each game’s folder in ', h('code', S.settings.xboxFolder || '/Hdd1/NetISO'), ', so Aurora adds it as a new game and looks it up online again. Aurora forgets anything else it kept for those tiles.')),
      h('div.modal-foot', h('span.note'), h('button.btn', { onclick: close }, 'Cancel'), go),

// 1st, 2nd, 3rd, 4th, 11th, 12th, 13th, 21st, 101st, 111th.
function ordinal(n) {

// Colours as #rrggbb, for the theme: mixed, and how far apart (WCAG's contrast).
const rgbOf = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const hexOf = rgb => '#' + rgb.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const x = rgbOf(a), y = rgbOf(b); return hexOf(x.map((v, i) => v + (y[i] - v) * t)); };
const alpha = (hex, a) => 'rgba(' + rgbOf(hex).join(', ') + ', ' + a + ')';

  const [r, g, b] = rgbOf(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;

function toward(colour, end, against, ratio) {
  for (let i = 0; i <= 20; i++) { const c = mix(colour, end, i / 20); if (contrast(c, against) >= ratio) return c; }
  return end;
}
// The theme's colours as CSS variables: the dashboard's own accent ones for
// this page in light or dark (so its buttons and switches take them, apart
// enough from the panels), and deep ones under white text (the banner, the
// big screen), with light ones (glow) to write on those.
function partyColours(theme, dark) {
  const valid = c => /^#[0-9a-f]{6}$/i.test(c || '');
  const p1 = valid(theme.accent) ? theme.accent.toLowerCase() : PartyPresets.classic.accent;
  const p2 = valid(theme.accent2) ? theme.accent2.toLowerCase() : PartyPresets.classic.accent2;
  const deep1 = toward(p1, '#000000', '#ffffff', 7);
  // A light second colour is a highlight: under the text it stays dark.
  const deep2 = luminance(p2) > 0.5 ? mix(deep1, '#000000', 0.4) : toward(p2, '#000000', '#ffffff', 7);
  const under = luminance(deep1) > luminance(deep2) ? deep1 : deep2;

    '--p1': p1, '--p2': p2, '--deep1': deep1, '--deep2': deep2, '--glow': toward(p1, '#ffffff', under, 4.5), '--glow2': toward(p2, '#ffffff', under, 4.5),
    '--accent': accent, '--accent-hover': mix(accent, dark ? '#ffffff' : '#000000', 0.12),
    '--on-accent': contrast(accent, '#ffffff') >= contrast(accent, '#111111') ? '#ffffff' : '#111111',

}

// The theme's pictures as this browser loaded them (blob: URLs: the server
// gives them only to the page's own requests), loaded again when they change:
// the server's version of them (theme.pictures) tells, here and on another
// device, such as the big screen on a TV.
const PartyPics = { key: '', loading: '', logo: '', backgrounds: [], changed: 0 };
function partyPictures(theme, loaded) {
  const key = (theme.logo ? 1 : 0) + '/' + theme.backgrounds + '/' + (theme.pictures || '') + '/' + PartyPics.changed;
  if (key !== PartyPics.key && key !== PartyPics.loading) {
    PartyPics.loading = key;
    const get = path => fetchImage(path).catch(() => '');
    const list = [theme.logo ? get('party/asset?kind=logo') : ''];
    for (let n = 0; n < theme.backgrounds; n++) list.push(get('party/asset?kind=background&n=' + n));
    Promise.all(list).then(urls => {
      const stale = PartyPics.loading !== key ? urls : [PartyPics.logo].concat(PartyPics.backgrounds);
      for (const u of stale) if (u) URL.revokeObjectURL(u);
      if (PartyPics.loading !== key) return;
      Object.assign(PartyPics, { key, loading: '', logo: urls[0], backgrounds: urls.slice(1) });
      if (loaded) loaded();

  }

}
function openPicture(blob) {
  return new Promise((done, failed) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); done(img); };
    img.onerror = () => { URL.revokeObjectURL(url); failed(new Error('That picture couldn’t be opened.')); };
    img.src = url;
  });
}
// A picture to send for the theme (PNG, JPEG or WebP, 3 MB at most), made
// smaller here first when it's bigger than the screens it's for, like a
// phone's photo.
async function picturePayload(file, kind) {
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw new Error('Choose a PNG, JPEG or WebP picture.');
  let blob = file;
  const img = await openPicture(file);
  const scale = Math.min(1, (kind === 'logo' ? 1024 : 2560) / Math.max(img.naturalWidth, img.naturalHeight, 1));
  if (scale < 1 || file.size > 3 * 1048576) {
    const canvas = h('canvas', { width: Math.max(1, Math.round(img.naturalWidth * scale)), height: Math.max(1, Math.round(img.naturalHeight * scale)) });
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    // A logo keeps its transparency; a photo needs none.
    blob = await new Promise(done => canvas.toBlob(done, kind === 'logo' && file.type !== 'image/jpeg' ? 'image/png' : 'image/jpeg', 0.86));
    if (!blob) throw new Error('That picture couldn’t be made smaller here.');
  }
  if (blob.size > 3 * 1048576) throw new Error('It’s over 3 MB; choose a smaller picture.');
  const data = await new Promise((done, failed) => {
    const reader = new FileReader();
    reader.onload = () => done(String(reader.result).replace(/^[^,]*,/, ''));
    reader.onerror = () => failed(new Error('That picture couldn’t be read.'));
    reader.readAsDataURL(blob);
  });
  return { kind, type: blob.type, data };
}

// A part of a page that is made again only when what it shows changed (its
// key), and not while something is typed in it; the focus stays on the same
// control (data-focus) when it is.
function livePart(el) {
  let drawn = null;
  return {
    el,
    show(key, build) {
      if (key === drawn) return;
      const at = document.activeElement, inside = at && at !== document.body && el.contains(at);
      if (inside && (at.tagName === 'TEXTAREA' || at.tagName === 'SELECT' || (at.tagName === 'INPUT' && !/^(checkbox|radio|button|file|color)$/.test(at.type)))) return;
      drawn = key;
      const focus = inside ? at.getAttribute('data-focus') : null;
      fill(el, build());
      const again = focus && [...el.querySelectorAll('[data-focus]')].find(x => x.getAttribute('data-focus') === focus);
      if (again) again.focus();
    },
    reset() { drawn = null; },
  };
}

// Versions as GitHub tags them: <0, 0 or >0 as a is older than, the same as or
// newer than b ("1.2.0", "v1.10.0", "1.2.0-beta.2"; a pre-release is older than its release).
function versionCompare(a, b) {
  const split = v => { v = String(v || '').replace(/^v/i, '').split('+')[0]; const i = v.indexOf('-'); return [v.slice(0, i < 0 ? v.length : i).split('.').map(n => parseInt(n, 10) || 0), i < 0 ? '' : v.slice(i + 1)]; };
  const [x, px] = split(a), [y, py] = split(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d < 0 ? -1 : 1; }
  if (!px || !py) return px ? -1 : py ? 1 : 0;
  const p = px.split('.'), q = py.split('.');
  for (let i = 0; ; i++) {
    if (i >= p.length || i >= q.length) return Math.sign(p.length - q.length);
    const m = /^\d+$/.test(p[i]), n = /^\d+$/.test(q[i]);
    const d = m && n ? Math.sign(p[i] - q[i]) : m !== n ? (m ? -1 : 1) : p[i] < q[i] ? -1 : p[i] > q[i] ? 1 : 0;
    if (d) return d;
  }
}

// What's known about updates: the server's own check (NetDisc360.exe), or, where
// the server can't reach GitHub (Docker), this browser's, kept for six hours.
let U = null;
const ReleasesApi = 'https://api.github.com/repos/marcusisdahl/NetDisc360/releases?per_page=20';
async function browserCheck(force) {
  const pre = !!S.settings.updatePrerelease;
  try {
    const kept = JSON.parse(store('update') || 'null');
    if (!force && kept && kept.pre === pre && Date.now() - kept.at < 6 * 3600e3) return kept.info;
  } catch (e) { /* checked again */ }
  const info = { checkedAt: 0, error: '', latest: null };
  try {
    const r = await fetch(ReleasesApi, { referrerPolicy: 'no-referrer', headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(r.status === 404 ? 'GitHub has no releases of NetDisc360 to show (404).' : r.status === 403 || r.status === 429 ? 'GitHub turned the check away for now (too many checks from this network). Try again later.' : 'GitHub answered with status ' + r.status + '.');
    const list = (await r.json()).filter(x => !x.draft && x.tag_name && (pre || !x.prerelease));
    info.checkedAt = Date.now() / 1000;
    list.sort((a, b) => versionCompare(b.tag_name, a.tag_name));
    if (!list.length) info.error = 'There are no releases on GitHub yet.';
    else {
      info.releases = list.map(x => ({ tag: x.tag_name, version: x.tag_name.replace(/^v/i, ''), name: x.name || '', notes: x.body || '', page: x.html_url, published: x.published_at, prerelease: !!x.prerelease }));
      info.latest = info.releases[0];
    }
  } catch (e) {
    info.error = e instanceof TypeError ? 'This browser couldn\u2019t reach GitHub. Is it online?' : e.message;
  }
  store('update', JSON.stringify({ at: Date.now(), pre, info }));
  return info;
}
// Fills U: the server's, or this browser's check.
async function loadUpdate(force) {
  if (S.update.checks) {
    const r = force ? await api('update/check', {}) : await api('update');
    U = Object.assign({}, r.update, { version: r.version });
  } else {
    const info = await browserCheck(force);
    U = Object.assign({ how: S.update.how, checks: false, installing: false }, info, { version: S.version });
    U.newer = !!(U.latest && versionCompare(U.latest.version, S.version) > 0);
    U.releases = (U.releases || []).map(r => Object.assign({}, r, { newer: versionCompare(r.version, S.version) > 0 }));
  }
  return U;
}
// Whether there's a newer version, for the sidebar and the dashboard.
function updateOut() {
  if (!S || !S.settings.updateCheck && !(U && U.newer)) return null;
  if (S.update.checks) return S.update.newer ? S.update.latest.version : null;
  return U && U.newer ? U.latest.version : null;
}

// The update this version came with, for a few days after it, until its changes were seen.
function justUpdated() {
  const last = S && S.update.history && S.update.history[0];
  if (!last || last.version !== S.version || (last.how !== 'app' && last.how !== 'other') || Date.now() / 1000 - last.at > 7 * 86400) return null;
  return store('seen-update') === last.version ? null : last;

// Release notes: GitHub's Markdown, its headings, lists, bold, code and links, as text.
function markdown(text) {
  const inline = line => {
    const out = [];
    const re = /\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s)]+)/g;
    let at = 0, m;
    while ((m = re.exec(line))) {
      if (m.index > at) out.push(line.slice(at, m.index));
      if (m[1]) out.push(h('b', m[1]));
      else if (m[2]) out.push(h('code', m[2]));
      else { const url = m[4] || m[5]; out.push(h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, m[3] || url.replace(/^https:\/\/github\.com\/[^/]+\/[^/]+\/(pull|issues)\/(\d+)$/, '#$2'))); }
      at = re.lastIndex;
    }
    if (at < line.length) out.push(line.slice(at));
    return out;
  };
  const nodes = [];
  let list = null, para = null;
  for (const raw of String(text || '').replace(/\r/g, '').split('\n')) {
    const line = raw.trim();
    const head = line.match(/^(#{1,4})\s+(.*)$/), item = line.match(/^[-*+]\s+(.*)$/);
    if (!line || head || item) para = null;
    if (!item) list = null;
    if (!line || /^!\[/.test(line) || /^<!--/.test(line)) continue;
    if (head) nodes.push(h(head[1].length <= 2 ? 'h3' : 'h4', inline(head[2])));
    else if (item) { if (!list) nodes.push(list = h('ul')); list.appendChild(h('li', inline(item[1]))); }
    else if (para) para.append(' ', ...inline(line));
    else nodes.push(para = h('p', inline(line)));
  }
  return nodes.length ? nodes : [h('p.muted', 'This release has no notes.')];
}

// Waits for the server to come back after a restart, then loads its page.
let restarting = false;
function awaitRestart(text) {
  if (restarting) return;
  restarting = true;
  store('restarted', text);
  let tries = 0;
  const before = S && S.uptime;
  const look = async () => {
    try {
      const r = await fetch('/api/state', { headers: { 'X-NetDisc': '1' } });
      if (r.ok || r.status === 401) {
        const st = r.ok ? await r.json() : null;
        if (!st || st.uptime < before || st.version !== S.version) { location.reload(); return; }
      }
    } catch (e) { /* not back yet */ }
    if (++tries < 120) setTimeout(look, 1000);
    else { restarting = false; toast('NetDisc360 didn\u2019t come back. Start it again from its folder or the Start menu.', true); }
  };
  setTimeout(look, 2000);
}

  async function findConsoles() {
    Wizard.finding = true; draw();
    try { Wizard.found = await api('consoles/find', {}); }
    catch (e) { toast(e.message, true); }
    Wizard.finding = false; draw();
    // One Xbox found and none chosen: that one.
    const xboxes = (Wizard.found ? Wizard.found.found : []);
    if (!Wizard.console && xboxes.length === 1) use(xboxes[0].address, true);
  }
  async function use(address, quiet) {
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(address)) { toast('Type an address like 192.168.1.30.', true); typed.focus(); return; }
    try { await api('consoles/add', { address }); } catch (e) { toast(e.message, true); return; }
    Wizard.console = address; Wizard.check = null;
    typed.value = '';
    if (!quiet) toast('Using the Xbox at ' + address);
    await refresh();
    draw();
  }
  function draw() {
    const known = S.consoles.filter(c => c.seen > 0);
    if (!Wizard.console && known.length) Wizard.console = known[0].address;
    const list = Wizard.found ? Wizard.found.found.slice() : [];
    for (const c of S.consoles) if (!list.some(f => f.address === c.address)) list.push({ address: c.address, known: true, listed: true });
    find.disabled = Wizard.finding;
    fill(results, Wizard.finding ? h('div.wz-scan', h('span.wz-radar', ic('radar')), h('div', h('b', 'Looking for consoles\u2026'), h('div.muted', 'On ' + (S.addresses.length ? S.addresses.map(a => a.replace(/\.\d+$/, '.x')).join(', ') : 'your network') + '. This takes a few seconds.'))) :
      list.length ? list.map(f => {
        const c = S.consoles.find(x => x.address === f.address);
        const on = Wizard.console === f.address;
        return h('div.wz-console' + (on ? '.on' : ''), h('div.icon', ic('monitor')),
          h('div.grow', h('b', f.address), h('div.sub',
            c && c.seen > 0 ? h('span.pill.good', h('span.dot.good'), 'Connected') : null,
            f.aurora ? h('span.pill.info', 'Aurora\u2019s FTP') : f.ftp ? h('span.pill.info', 'FTP') : null,
            f.xbdm ? h('span.pill.off', 'xbdm') : null,
            f.listed && !f.aurora && !(c && c.seen > 0) ? h('span.muted', 'Added before') : null)),
          on ? h('span.pill.good', ic('check', 'sm'), 'This one') : h('button.btn.small', { onclick: () => use(f.address) }, 'Use this one'));
      }) : Wizard.found ? h('div.wz-scan', h('span.wz-icon', ic('search')), h('div', h('b', 'No Xbox found'),
        h('div.muted', 'Is it on, in Aurora, with the FTP server turned on? ' + (isDocker() ? 'In Docker, the container needs host networking to see the network. ' : '') + 'You can also type its address below.'))) : null);
    const c = S.consoles.find(x => x.address === Wizard.console);
    fill(status, Wizard.console ? h('div.wz-status' + (c && c.seen > 0 ? '.good' : ''),
      c && c.seen > 0 ? [ic('circle-check'), h('span', h('b', 'The Xbox at ' + Wizard.console + ' is connected.'), ' It sees your games.')]
        : [h('span.wz-wait', ic('loader-circle', 'spin')), h('span', 'Waiting for the Xbox at ', h('b', Wizard.console), ' to connect. Restart it once NetDisc360.ini is in place.')]) : null);
  }
  if (!Wizard.found && !Wizard.finding) findConsoles(); else draw();
  return { update: draw };
};

// Which release of a project a file on the console is from: GitHub's list
// of releases gives each file's SHA-256. Asked by this browser.
const ReleaseLists = {};
function releaseList(repo) {
  if (!ReleaseLists[repo]) ReleaseLists[repo] = fetch('https://api.github.com/repos/' + repo + '/releases?per_page=50', { referrerPolicy: 'no-referrer' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('GitHub said ' + r.status)))
    .then(list => list.filter(r => !r.draft && !r.prerelease))
    .catch(e => { delete ReleaseLists[repo]; throw e; });
  return ReleaseLists[repo];
}
// { version, newest, page } for the file with this SHA-256 (version '' if no release has it), names: its file names.
async function fromRelease(repo, sha, names) {
  const list = await releaseList(repo);
  const named = r => r.assets.some(a => names.includes(a.name.toLowerCase()));
  const newest = list.find(named);
  const from = list.find(r => r.assets.some(a => (a.digest || '').toLowerCase() === 'sha256:' + sha));
  const v = r => r ? r.tag_name.replace(/^v/, '') : '';
  return { version: v(from), newest: v(newest), page: newest ? newest.html_url : 'https://github.com/' + repo + '/releases' };
}

function consoleChecks(r) {
  const st = S.settings, out = [];
  if (!r.ftp) return [wzCheck('bad', 'Aurora\u2019s FTP server doesn\u2019t answer at ' + r.address, 'Is the Xbox on and in Aurora, with the FTP server turned on (Aurora\u2019s settings, Network)?')];
  if (!r.login) return [wzCheck('good', 'Aurora\u2019s FTP server answers'), wzCheck('bad', 'The login didn\u2019t work', 'Use the user name and password from Aurora\u2019s FTP settings. (' + r.error + ')')];
  out.push(wzCheck('good', 'Logged in to Aurora\u2019s FTP server'));
  out.push(r.aurora ? wzCheck('good', 'Aurora is in ' + st.aurora.replace(/^\/(\w+)/, '$1:').replace(/\//g, '\\'))
    : wzCheck('warn', 'Aurora isn\u2019t in ' + st.aurora, 'NetDisc360 can\u2019t add the Xbox 360 category rule there. Set Aurora\u2019s folder under Settings, Xbox & Aurora.'));
  const games = st.xboxFolder.replace(/^\/(\w+)/, '$1:').replace(/\//g, '\\');
  out.push(r.gameFolder ? wzCheck('good', games + ' is there') : wzCheck('info', games + ' isn\u2019t there yet', 'NetDisc360 makes it. Add it to Aurora\u2019s scan paths with depth 1.'));
  if (!r.launchIni) {
    out.push(wzCheck('warn', 'No launch.ini found', 'DashLaunch reads it from the root of the USB drive or hard drive. The plugins couldn\u2019t be checked.'));
    return out;
  }
  const where = r.launchIni.replace(/^\/(\w+)\//, '$1:\\');
  const plugin = kind => r.plugins.find(p => p.kind === kind);
  const netiso = plugin('netiso'), tiles = plugin('tiles'), usb = plugin('usbnet');
  // NetDisc360.xex has its own disc drive; NetISO.xex is only needed with the older NetIsoTiles.xex.
  // With both, the first one DashLaunch loads is the drive: NetDisc360.xex stays off after NetISO.xex.
  const ownDrive = tiles && /netdisc360/i.test(tiles.name);
  if (!netiso && ownDrive) {
    out.push(wzCheck('good', 'NetDisc360.xex is the disc drive', 'NetISO.xex isn\u2019t needed with it.'));
    if (tiles.found) {
      const file = (tiles.serverFrom || '').replace(/^\/(\w+)\//, '$1:\\').replace(/\//g, '\\');
      if (!tiles.txt) out.push(wzCheck('warn', 'The Xbox doesn\u2019t know this computer', ['Download NetDisc360.ini on the step before and put it next to ', h('code', tiles.path), '.']));
      else if (!tiles.here) out.push(wzCheck('warn', file + ' says ' + (tiles.server || 'nothing'), 'This computer is ' + (S.addresses.join(' or ') || 'somewhere else') + '. Download a new NetDisc360.ini on the step before.'));
      else out.push(wzCheck('good', file + ' points to this computer', tiles.server));
    }
  }
  else if (!netiso) out.push(wzCheck('bad', 'Neither NetDisc360.xex nor NetISO.xex is loaded', ['Add NetDisc360.xex to the [Plugins] section of ', h('code', where), ', like ', h('code', 'plugin1 = Usb:\\NetDisc360.xex'), '.']));
  else if (!netiso.found) out.push(wzCheck('bad', 'NetISO.xex isn\u2019t where launch.ini says', h('code', netiso.path)));
  else {
    const known = NetIsoVersions[netiso.sha256];
    out.push(wzCheck(known ? 'good' : 'info', netiso.name + ' is plugin ' + netiso.slot, known ? known + '.' : 'Not a version NetDisc360 knows (' + bytes(netiso.size) + '). It works if it\u2019s the one from ConsoleMods\u2019 NetISO kit.'));
    if (!netiso.txt) out.push(wzCheck('warn', 'NetISO.xex.txt is missing', 'Without it NetISO doesn\u2019t know this computer. Download it on the step before and put it next to NetISO.xex.'));
    else if (!netiso.here) out.push(wzCheck('warn', 'NetISO.xex.txt says ' + (netiso.server || 'nothing'), 'This computer is ' + (S.addresses.join(' or ') || 'somewhere else') + '. Download a new one on the step before.'));
    else out.push(wzCheck('good', 'NetISO.xex.txt points to this computer', netiso.server));
    if (ownDrive) out.push(netiso.slot < tiles.slot
      ? wzCheck('info', 'NetISO.xex is the disc drive', ['NetDisc360.xex has its own, faster one, which stays off while NetISO.xex loads first. Take the NetISO.xex line out of ', h('code', where), ' to use it.'])
      : wzCheck('bad', 'NetISO.xex loads after NetDisc360.xex', ['Two disc drives don\u2019t mix. Take the NetISO.xex line out of ', h('code', where), '.']));
  }
  const release = (p, repo, names, title, missing, unknown) => {
    if (!p) { if (missing) out.push(missing); return; }
    if (!p.found) { out.push(wzCheck('warn', p.name + ' isn\u2019t where launch.ini says', h('code', p.path))); return; }
    const line = wzCheck('info', title + ' is plugin ' + p.slot, 'Asking GitHub which version it is\u2026');
    out.push(line);
    fromRelease(repo, p.sha256, names).then(v => {
      line.replaceWith(v.version && v.version === v.newest ? wzCheck('good', title + ' ' + v.version + ' is plugin ' + p.slot, 'The newest version.')
        : v.version ? wzCheck('warn', title + ' ' + v.version + ' is plugin ' + p.slot, [v.newest + ' is out. ', h('a', { href: v.page, target: '_blank', rel: 'noopener noreferrer' }, 'Get it'), ', copy it over ', h('code', p.path), ' and restart the Xbox.'])
        : wzCheck('info', title + ' is plugin ' + p.slot, unknown || 'It isn\u2019t from a release on GitHub (a build of your own?).'));
    }).catch(() => line.replaceWith(wzCheck('info', title + ' is plugin ' + p.slot, 'GitHub didn\u2019t answer, so its version wasn\u2019t checked.')));
  };
  release(tiles, 'marcusisdahl/NetDisc360', ['netdisc360.xex', 'netisotiles.xex'], tiles ? tiles.name : 'NetDisc360.xex',
    wzCheck('warn', 'NetDisc360.xex isn\u2019t loaded', ['It is the disc drive the games come from, keeps the Guide working in games and handles disc swaps. Get it from NetDisc360\u2019s release and add it to ', h('code', where), '.']));
  release(usb, 'marcusisdahl/NetUsb360', ['netusb360.xex', 'netusb360-acksmall.xex', 'usbnet360.xex', 'usbnet360-acksmall.xex'], usb ? usb.name : '', null,
    ['Not a NetUsb360 release. ', h('a', { href: 'https://github.com/marcusisdahl/NetUsb360/releases/latest', target: '_blank', rel: 'noopener noreferrer' }, 'NetUsb360'), ' loads games faster with a gigabit USB adapter.']);
  if (r.plugins.length > 5) out.push(wzCheck('warn', 'launch.ini has ' + r.plugins.length + ' plugins', 'DashLaunch loads 5 at most.'));
  if (r.default && !/aurora/i.test(r.default)) out.push(wzCheck('info', 'The Xbox starts ' + r.default, 'Set Default in launch.ini to Aurora.xex to start straight in Aurora.'));
  out.push(r.connected ? wzCheck('good', 'The Xbox is connected to NetDisc360') : wzCheck('info', 'The Xbox hasn\u2019t connected yet', 'Restart it after changing launch.ini, NetDisc360.ini or NetISO.xex.txt.'));
  return out;
}

WizardParts.aurora = body => {
  const st = S.settings;
  const user = h('input.input', { value: st.ftpUser, autocomplete: 'off' });
  const password = h('input.input', { type: 'password', placeholder: st.ftpPasswordSet ? 'Unchanged' : 'Password', autocomplete: 'new-password' });
  const results = h('ul.wz-checks'), checkButton = h('button.btn', { onclick: () => check() }, ic('scan', 'sm'), 'Check my Xbox');
  fill(body,
    wzHead('Put your games in Aurora', 'NetDisc360 adds a small folder for every game to the Xbox over Aurora\u2019s FTP server. Aurora then lists them with their cover art, like installed games.'),
    h('ol.wz-how', h('li', 'In Aurora\u2019s settings, turn the ', h('b', 'FTP server'), ' on.'),
      h('li', 'Under Content, ', h('b', 'Scan paths'), ', add ', h('code', 'Hdd1:\\NetISO'), ' with depth 1. It can be empty; NetDisc360 fills it.')),
    st.preset.ftp && isDocker() ? wzPreset('The login from your Docker settings is filled in.') : null,
    h('div.form.cols', wzField('Aurora\u2019s FTP user', user), wzField('Password', password, 'Aurora\u2019s default login is xboxftp / xboxftp.')),
    wzRow('Show them in Aurora\u2019s Xbox 360 category', 'Adds one rule to Aurora\u2019s game filter. Without it they show under All.', wzToggle(st.category, (v, i) => save({ category: v }).then(ok => { if (!ok) i.checked = !v; }))),
    h('div.wz-box', h('div.wz-row', h('h3', 'Check your Xbox'), h('span.grow'), checkButton),
      h('p.muted', { style: { margin: '0 0 8px' } }, 'Logs in with this login, and looks at DashLaunch\u2019s launch.ini: is NetISO loaded, does NetISO.xex.txt point here, and are the plugins the newest?'),
      results));
  async function check() {
    if (!Wizard.console) { fill(results, wzCheck('info', 'No Xbox chosen', 'Find it on the step before, or type its address there.')); return; }
    Wizard.checking = true; checkButton.disabled = true;
    fill(results, wzCheck('info', 'Checking the Xbox at ' + Wizard.console + '\u2026', null));
    try { Wizard.check = await api('consoles/check', { address: Wizard.console, ftpUser: user.value, ftpPassword: password.value }); fill(results, consoleChecks(Wizard.check)); }
    catch (e) { fill(results, wzCheck('bad', 'The check didn\u2019t work', e.message)); }
    Wizard.checking = false; checkButton.disabled = false;
  }
  if (Wizard.check && Wizard.check.address === Wizard.console) fill(results, consoleChecks(Wizard.check));
  else if (Wizard.console) check();
  return {
    async next() {
      if (user.value !== st.ftpUser || password.value) {
        const c = { ftpUser: user.value };
        if (password.value) c.ftpPassword = password.value;
        if (!(await save(c, 'FTP login saved'))) return false;
      }
      return true;
    },
  };
};

WizardParts.extras = body => {
  const st = S.settings;
  const flip = name => (v, i) => save({ [name]: v }).then(ok => { if (!ok) i.checked = !v; });
  fill(body,
    wzHead('A few extras', 'All of these can be changed later in Settings.'),
    h('div.card-body.wz-extras',
      st.startWithWindows !== undefined ? wzRow('Start with Windows', 'Runs NetDisc360 behind its icon by the clock when you sign in, so your games are always there.', wzToggle(st.startWithWindows, flip('startWithWindows'))) : null,
      wzRow('Look for updates', 'Asks GitHub now and then for a new NetDisc360. Nothing about you or your games is sent.', wzToggle(st.updateCheck, flip('updateCheck'))),
      S.update.how === 'app' ? wzRow('Install updates by themselves', 'When no console is playing. Your settings are backed up first.', wzToggle(st.updateAuto, flip('updateAuto'))) : null,
      S.files.settings ? wzRow('Back up the settings every week', 'Your folders, consoles and logins, in case. Never your games.', wzToggle(st.backupEvery > 0, (v, i) => save({ backupEvery: v ? 7 : 0 }).then(ok => { if (!ok) i.checked = !v; }))) : null,
      wzRow('Cover art on this page', 'Loaded by this browser from the XboxUnity archive on GitHub.', wzToggle(showCovers(), v => store('covers', v ? 'on' : 'off')))));
  return {};
};

WizardParts.done = body => {
  const list = h('ul.wz-checks');
  fill(body, h('div.wz-hero', h('div.wz-mark.done', ic('party-popper', 'lg')), h('h1', 'You\u2019re set'),
    h('p', 'NetDisc360 keeps running and serving your games. New games you put in your folders show up in Aurora by themselves.')), list);
  return {
    update() {
      const st = S.settings, c = S.consoles.find(x => x.address === Wizard.console) || S.consoles.find(x => x.seen > 0);
      fill(list,
        st.password ? wzCheck('good', 'The dashboard has a password') : wzCheck(st.webAddress === '0.0.0.0' ? 'warn' : 'info', 'No password', st.webAddress === '0.0.0.0' ? 'Anyone on your network can change the settings. Set one under Settings, Dashboard.' : 'Only this computer can open the dashboard.'),
        S.folders.length ? wzCheck('good', plural(S.library.games, 'game') + ' in ' + plural(S.folders.length, 'folder')) : wzCheck('warn', 'No game folders yet', 'Add one on the Game folders page.'),
        !c ? wzCheck('info', 'No Xbox yet', 'It shows up on the Consoles page when NetISO connects.')
          : c.seen > 0 ? wzCheck('good', 'NetISO on ' + c.address + ' is connected') : wzCheck('info', 'Waiting for NetISO on ' + c.address, 'Restart the Xbox once NetISO.xex.txt is in place.'),
        !c || !st.push ? null : c.synced ? wzCheck('good', 'Your games are in Aurora on ' + c.address, 'Aurora fetches their cover art within a minute or so.')
          : c.ftp === 1 ? wzCheck('warn', 'Aurora\u2019s FTP server on ' + c.address + ' doesn\u2019t answer', 'Your games go in once it does.')
          : wzCheck('info', 'Adding your games to Aurora on ' + c.address + '\u2026', 'Within a minute or two of the Xbox showing up.'));
    },
  };
};

// Logging in -------------------------------------------------------------------------

function showLogin() {
  if ($('.login')) return;
  clearTimeout(timer);
  const password = h('input.input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
  const problem = h('p.muted', { style: { minHeight: '20px', margin: '10px 0 0', color: 'var(--bad)' } });
  const go = async e => {
    e.preventDefault();
    try { await api('login', { password: password.value }); location.reload(); }
    catch (err) { fill(problem, err.message); password.select(); }
  };
  fill($('#app'), h('div.login', { style: { flex: 1 } }, h('form.card', { onsubmit: go },
    mark(), h('h1', 'NetDisc360'), h('p.muted', { style: { margin: '0 0 18px' } }, 'Enter the dashboard\u2019s password.'),
    password, problem, h('button.btn.primary', { type: 'submit', style: { width: '100%', marginTop: '6px' } }, 'Log in'))));
  password.focus();
}

applyTheme();
refresh();
