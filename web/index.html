// Which release of a project a file on the console is from: GitHub's list
// of releases gives each file's SHA-256. Asked by this browser.
const ReleaseLists = {};
function releaseList(repo) {
  if (!ReleaseLists[repo]) ReleaseLists[repo] = fetch('https://api.github.com/repos/' + repo + '/releases?per_page=50', { referrerPolicy: 'no-referrer' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('GitHub said ' + r.status)))
    .then(list => list.filter(r => !r.draft && !r.prerelease))
    .catch(e => { delete ReleaseLists[repo]; throw e; });
  return ReleaseLists[repo];
}
// { version, newest, page } for the file with this SHA-256 (version '' if no release has it), names: its file names.
async function fromRelease(repo, sha, names) {
  const list = await releaseList(repo);
  const named = r => r.assets.some(a => names.includes(a.name.toLowerCase()));
  const newest = list.find(named);
  const from = list.find(r => r.assets.some(a => (a.digest || '').toLowerCase() === 'sha256:' + sha));
  const v = r => r ? r.tag_name.replace(/^v/, '') : '';
  return { version: v(from), newest: v(newest), page: newest ? newest.html_url : 'https://github.com/' + repo + '/releases' };
}

function consoleChecks(r) {
  const st = S.settings, out = [];
  if (!r.ftp) return [wzCheck('bad', 'Aurora\u2019s FTP server doesn\u2019t answer at ' + r.address, 'Is the Xbox on and in Aurora, with the FTP server turned on (Aurora\u2019s settings, Network)?')];
  if (!r.login) return [wzCheck('good', 'Aurora\u2019s FTP server answers'), wzCheck('bad', 'The login didn\u2019t work', 'Use the user name and password from Aurora\u2019s FTP settings. (' + r.error + ')')];
  out.push(wzCheck('good', 'Logged in to Aurora\u2019s FTP server'));
  out.push(r.aurora ? wzCheck('good', 'Aurora is in ' + xboxPath(st.aurora))
    : wzCheck('warn', 'Aurora isn\u2019t in ' + st.aurora, 'NetDisc360 can\u2019t add the Xbox 360 category rule there. Set Aurora\u2019s folder under Settings, Xbox & Aurora.'));
  const games = xboxPath(st.xboxFolder);
  out.push(r.gameFolder ? wzCheck('good', games + ' is there') : wzCheck('info', games + ' isn\u2019t there yet', 'NetDisc360 makes it. Add it to Aurora\u2019s scan paths with depth 1.'));
  if (r.scanPaths) {
    out.push(r.scansGames ? wzCheck('good', 'Aurora scans ' + games, 'So it lists the games NetDisc360 adds.')
      : wzCheck('bad', 'Aurora doesn\u2019t scan ' + games, ['Aurora won\u2019t list your PC games. In Aurora: Settings, Content, Scan paths, add ', h('code', games), ' with depth 1, then scan.',
        r.scanPaths.length ? ' It scans ' + r.scanPaths.map(p => p.path.replace(/^\/(\w+)/, '$1:').replace(/\//g, '\\') + ' (depth ' + p.depth + ')').join(', ') + '.' : ' It scans nothing yet.']));
    if (!r.scansHddGames) out.push(wzCheck('info', 'Aurora doesn\u2019t scan Hdd1:\\Games', 'Copy to Xbox puts original Xbox games there. Add it in Aurora (Settings, Content, Scan paths, depth 1) to see them.'));
  } else if (r.scanError) out.push(wzCheck('info', 'Couldn\u2019t read Aurora\u2019s scan paths', r.scanError));
  if (!r.launchIni) {
    out.push(wzCheck('warn', 'No launch.ini found', 'DashLaunch reads it from the root of the USB drive or hard drive. The plugins couldn\u2019t be checked.'));
    return out;
  }
  const where = r.launchIni.replace(/^\/(\w+)\//, '$1:\\');
  const plugin = kind => r.plugins.find(p => p.kind === kind);
  const netiso = plugin('netiso'), tiles = plugin('tiles'), usb = plugin('usbnet');
  // NetDisc360.xex has its own disc drive; NetISO.xex is only needed with the older NetIsoTiles.xex.
  // With both, the first one DashLaunch loads is the drive: NetDisc360.xex stays off after NetISO.xex.
  const ownDrive = tiles && /netdisc360/i.test(tiles.name);
  if (!netiso && ownDrive) {
    out.push(wzCheck('good', 'NetDisc360.xex is the disc drive', 'NetISO.xex isn\u2019t needed with it.'));
    if (tiles.found) {
      const file = (tiles.serverFrom || '').replace(/^\/(\w+)\//, '$1:\\').replace(/\//g, '\\');
      if (!tiles.txt) out.push(wzCheck('warn', 'The Xbox doesn\u2019t know this computer', ['Download NetDisc360.ini on the step before and put it next to ', h('code', tiles.path), '.']));
      else if (!tiles.here) out.push(wzCheck('warn', file + ' says ' + (tiles.server || 'nothing'), 'This computer is ' + (S.addresses.join(' or ') || 'somewhere else') + '. Download a new NetDisc360.ini on the step before.'));
      else out.push(wzCheck('good', file + ' points to this computer', tiles.server));
    }
  }
  else if (!netiso) out.push(wzCheck('bad', 'Neither NetDisc360.xex nor NetISO.xex is loaded', ['Add NetDisc360.xex to the [Plugins] section of ', h('code', where), ', like ', h('code', 'plugin1 = Usb:\\NetDisc360.xex'), '.']));
  else if (!netiso.found) out.push(wzCheck('bad', 'NetISO.xex isn\u2019t where launch.ini says', h('code', netiso.path)));
  else {
    const known = NetIsoVersions[netiso.sha256];
    out.push(wzCheck(known ? 'good' : 'info', netiso.name + ' is plugin ' + netiso.slot, known ? known + '.' : 'Not a version NetDisc360 knows (' + bytes(netiso.size) + '). It works if it\u2019s the one from ConsoleMods\u2019 NetISO kit.'));
    if (!netiso.txt) out.push(wzCheck('warn', 'NetISO.xex.txt is missing', 'Without it NetISO doesn\u2019t know this computer. Download it on the step before and put it next to NetISO.xex.'));
    else if (!netiso.here) out.push(wzCheck('warn', 'NetISO.xex.txt says ' + (netiso.server || 'nothing'), 'This computer is ' + (S.addresses.join(' or ') || 'somewhere else') + '. Download a new one on the step before.'));
    else out.push(wzCheck('good', 'NetISO.xex.txt points to this computer', netiso.server));
    if (ownDrive) out.push(netiso.slot < tiles.slot
      ? wzCheck('info', 'NetISO.xex is the disc drive', ['NetDisc360.xex has its own, faster one, which stays off while NetISO.xex loads first. Take the NetISO.xex line out of ', h('code', where), ' to use it.'])
      : wzCheck('bad', 'NetISO.xex loads after NetDisc360.xex', ['Two disc drives don\u2019t mix. Take the NetISO.xex line out of ', h('code', where), '.']));
  }
  const release = (p, repo, names, title, missing, unknown) => {
    if (!p) { if (missing) out.push(missing); return; }
    if (!p.found) { out.push(wzCheck('warn', p.name + ' isn\u2019t where launch.ini says', h('code', p.path))); return; }
    const line = wzCheck('info', title + ' is plugin ' + p.slot, 'Asking GitHub which version it is\u2026');
    out.push(line);
    fromRelease(repo, p.sha256, names).then(v => {
      line.replaceWith(v.version && v.version === v.newest ? wzCheck('good', title + ' ' + v.version + ' is plugin ' + p.slot, 'The newest version.')
        : v.version ? wzCheck('warn', title + ' ' + v.version + ' is plugin ' + p.slot, [v.newest + ' is out. ', h('a', { href: v.page, target: '_blank', rel: 'noopener noreferrer' }, 'Get it'), ', copy it over ', h('code', p.path), ' and restart the Xbox.'])
        : wzCheck('info', title + ' is plugin ' + p.slot, unknown || 'It isn\u2019t from a release on GitHub (a build of your own?).'));
    }).catch(() => line.replaceWith(wzCheck('info', title + ' is plugin ' + p.slot, 'GitHub didn\u2019t answer, so its version wasn\u2019t checked.')));
  };
  release(tiles, 'marcusisdahl/NetDisc360', ['netdisc360.xex', 'netisotiles.xex'], tiles ? tiles.name : 'NetDisc360.xex',
    wzCheck('warn', 'NetDisc360.xex isn\u2019t loaded', ['It is the disc drive the games come from, keeps the Guide working in games and handles disc swaps. Get it from NetDisc360\u2019s release and add it to ', h('code', where), '.']));
  release(usb, 'marcusisdahl/NetUsb360', ['netusb360.xex', 'netusb360-acksmall.xex', 'usbnet360.xex', 'usbnet360-acksmall.xex'], usb ? usb.name : '', null,
    ['Not a NetUsb360 release. ', h('a', { href: 'https://github.com/marcusisdahl/NetUsb360/releases/latest', target: '_blank', rel: 'noopener noreferrer' }, 'NetUsb360'), ' loads games faster with a gigabit USB adapter.']);
  if (r.plugins.length > 5) out.push(wzCheck('warn', 'launch.ini has ' + r.plugins.length + ' plugins', 'DashLaunch loads 5 at most.'));
  if (r.default && !/aurora/i.test(r.default)) out.push(wzCheck('info', 'The Xbox starts ' + r.default, 'Set Default in launch.ini to Aurora.xex to start straight in Aurora.'));
  out.push(r.connected ? wzCheck('good', 'The Xbox is connected to NetDisc360') : wzCheck('info', 'The Xbox hasn\u2019t connected yet', 'Restart it after changing launch.ini, NetDisc360.ini or NetISO.xex.txt.'));
  return out;
}

WizardParts.aurora = body => {
  const st = S.settings;
  const user = h('input.input', { value: st.ftpUser, autocomplete: 'off' });
  const password = h('input.input', { type: 'password', placeholder: st.ftpPasswordSet ? 'Unchanged' : 'Password', autocomplete: 'new-password' });
  const results = h('ul.wz-checks'), checkButton = h('button.btn', { onclick: () => check() }, ic('scan', 'sm'), 'Check my Xbox');
  fill(body,
    wzHead('Put your games in Aurora', 'NetDisc360 adds a small folder for every game to the Xbox over Aurora\u2019s FTP server. Aurora then lists them with their cover art, like installed games.'),
    h('ol.wz-how', h('li', 'In Aurora\u2019s settings, turn the ', h('b', 'FTP server'), ' on.'),
      h('li', 'Under Content, ', h('b', 'Scan paths'), ', add ', h('code', gamesFolder()), ' with depth 1. It can be empty; NetDisc360 fills it. If you had Hdd1:\\NetISO there, NetDisc360 changes it for you.')),
    st.preset.ftp && isDocker() ? wzPreset('The login from your Docker settings is filled in.') : null,
    h('div.form.cols', wzField('Aurora\u2019s FTP user', user), wzField('Password', password, 'Aurora\u2019s default login is xboxftp / xboxftp.')),
    wzRow('Show them in Aurora\u2019s Xbox 360 category', 'Adds one rule to Aurora\u2019s game filter. Without it they show under All.', wzToggle(st.category, (v, i) => save({ category: v }).then(ok => { if (!ok) i.checked = !v; }))),
    h('div.wz-box', h('div.wz-row', h('h3', 'Check your Xbox'), h('span.grow'), checkButton),
      h('p.muted', { style: { margin: '0 0 8px' } }, 'Logs in with this login, and looks at DashLaunch\u2019s launch.ini: is NetISO loaded, does NetISO.xex.txt point here, and are the plugins the newest?'),
      results));
  async function check() {
    if (!Wizard.console) { fill(results, wzCheck('info', 'No Xbox chosen', 'Find it on the step before, or type its address there.')); return; }
    Wizard.checking = true; checkButton.disabled = true;
    fill(results, wzCheck('info', 'Checking the Xbox at ' + Wizard.console + '\u2026', null));
    try { Wizard.check = await api('consoles/check', { address: Wizard.console, ftpUser: user.value, ftpPassword: password.value }); fill(results, consoleChecks(Wizard.check)); }
    catch (e) { fill(results, wzCheck('bad', 'The check didn\u2019t work', e.message)); }
    Wizard.checking = false; checkButton.disabled = false;
  }
  if (Wizard.check && Wizard.check.address === Wizard.console) fill(results, consoleChecks(Wizard.check));
  else if (Wizard.console) check();
  return {
    async next() {
      if (user.value !== st.ftpUser || password.value) {
        const c = { ftpUser: user.value };
        if (password.value) c.ftpPassword = password.value;
        if (!(await save(c, 'FTP login saved'))) return false;
      }
      return true;
    },
  };
};

WizardParts.extras = body => {
  const st = S.settings;
  const flip = name => (v, i) => save({ [name]: v }).then(ok => { if (!ok) i.checked = !v; });
  fill(body,
    wzHead('A few extras', 'All of these can be changed later in Settings.'),
    h('div.card-body.wz-extras',
      st.startWithWindows !== undefined ? wzRow('Start with Windows', 'Runs NetDisc360 behind its icon by the clock when you sign in, so your games are always there.', wzToggle(st.startWithWindows, flip('startWithWindows'))) : null,
      wzRow('Look for updates', 'Asks GitHub now and then for a new NetDisc360. Nothing about you or your games is sent.', wzToggle(st.updateCheck, flip('updateCheck'))),
      S.update.how === 'app' ? wzRow('Install updates by themselves', 'When no console is playing. Your settings are backed up first.', wzToggle(st.updateAuto, flip('updateAuto'))) : null,
      S.files.settings ? wzRow('Back up the settings every week', 'Your folders, consoles and logins, in case. Never your games.', wzToggle(st.backupEvery > 0, (v, i) => save({ backupEvery: v ? 7 : 0 }).then(ok => { if (!ok) i.checked = !v; }))) : null,
      wzRow('Cover art on this page', 'Loaded by this browser from the XboxUnity archive on GitHub.', wzToggle(showCovers(), v => store('covers', v ? 'on' : 'off')))));
  return {};
};

WizardParts.done = body => {
  const list = h('ul.wz-checks');
  fill(body, h('div.wz-hero', h('div.wz-mark.done', ic('party-popper', 'lg')), h('h1', 'You\u2019re set'),
    h('p', 'NetDisc360 keeps running and serving your games. New games you put in your folders show up in Aurora by themselves.')), list);
  return {
    update() {
      const st = S.settings, c = S.consoles.find(x => x.address === Wizard.console) || S.consoles.find(x => x.seen > 0);
      fill(list,
        st.password ? wzCheck('good', 'The dashboard has a password') : wzCheck(st.webAddress === '0.0.0.0' ? 'warn' : 'info', 'No password', st.webAddress === '0.0.0.0' ? 'Anyone on your network can change the settings. Set one under Settings, Dashboard.' : 'Only this computer can open the dashboard.'),
        S.folders.length ? wzCheck('good', plural(S.library.games, 'game') + ' in ' + plural(S.folders.length, 'folder')) : wzCheck('warn', 'No game folders yet', 'Add one on the Game folders page.'),
        !c ? wzCheck('info', 'No Xbox yet', 'It shows up on the Consoles page when NetISO connects.')
          : c.seen > 0 ? wzCheck('good', 'NetISO on ' + c.address + ' is connected') : wzCheck('info', 'Waiting for NetISO on ' + c.address, 'Restart the Xbox once NetISO.xex.txt is in place.'),
        !c || !st.push ? null : c.synced ? wzCheck('good', 'Your games are in Aurora on ' + c.address, 'Aurora fetches their cover art within a minute or so.')
          : c.ftp === 1 ? wzCheck('warn', 'Aurora\u2019s FTP server on ' + c.address + ' doesn\u2019t answer', 'Your games go in once it does.')
          : wzCheck('info', 'Adding your games to Aurora on ' + c.address + '\u2026', 'Within a minute or two of the Xbox showing up.'));
    },
  };
};

// Logging in -------------------------------------------------------------------------

function showLogin() {
  if ($('.login')) return;
  clearTimeout(timer);
  const password = h('input.input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
  const problem = h('p.muted', { style: { minHeight: '20px', margin: '10px 0 0', color: 'var(--bad)' } });
  const go = async e => {
    e.preventDefault();
    try { await api('login', { password: password.value }); location.reload(); }
    catch (err) { fill(problem, err.message); password.select(); }
  };
  fill($('#app'), h('div.login', { style: { flex: 1 } }, h('form.card', { onsubmit: go },
    mark(), h('h1', 'NetDisc360'), h('p.muted', { style: { margin: '0 0 18px' } }, 'Enter the dashboard\u2019s password.'),
    password, problem, h('button.btn.primary', { type: 'submit', style: { width: '100%', marginTop: '6px' } }, 'Log in'))));
  password.focus();
}

applyTheme();
refresh();
</script>
