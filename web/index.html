<!doctype html>
<!-- SPDX-License-Identifier: MIT
     NetDisc360's dashboard, served by the server itself (server/web.cpp). The
     same page runs for NetDisc360.exe and in Docker. tools/make_web.py builds it
     into server/web_page.h, with the icons from web/icons.svg in place of the
     icons comment below. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NetDisc360</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23107c10'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-opacity='.45' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --side: #ffffff; --line: #e3e5e9; --line-strong: #d0d4da; --hover: #f0f2f5;
  --text: #1c1e22; --muted: #5d6470; --faint: #959ca8;
  --accent: #107c10; --accent-hover: #0d6b0d; --on-accent: #ffffff; --accent-soft: #e5f2e5; --accent-text: #0e6e0e;
  --good: #1e8a3a; --good-soft: #e3f4e7; --warn: #9a5b00; --warn-soft: #fdf1dc; --bad: #c42b1c; --bad-soft: #fde7e4;
  --info: #2f6fd6; --info-soft: #e6eefc; --play: #7b4fc9; --play-soft: #efe8fb;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05); --shadow-pop: 0 12px 32px rgba(16, 24, 40, .18);
  --field: #ffffff; --chart-grid: #eceef1;
  --s1: #107c10; --s2: #2f6fd6; --s3: #8b5cf6; --s4: #d97706; --s5: #db2777; --s6: #0d9488;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #121417; --panel: #1b1e22; --side: #16181b; --line: #2a2e34; --line-strong: #3a3f46; --hover: #23272c;
  --text: #e8eaed; --muted: #a0a7b1; --faint: #69707a;
  --accent: #5cc35c; --accent-hover: #6fd16f; --on-accent: #0a1a0a; --accent-soft: #1d3020; --accent-text: #7dd37d;
  --good: #5cc35c; --good-soft: #1d3020; --warn: #e7a43c; --warn-soft: #3a2c14; --bad: #f0675c; --bad-soft: #3d1d1a;
  --info: #6fa1ff; --info-soft: #1c2a42; --play: #b192f5; --play-soft: #2b2340;
  --shadow: none; --shadow-pop: 0 12px 40px rgba(0, 0, 0, .5);
  --field: #15171a; --chart-grid: #262a2f;
  --s1: #5cc35c; --s2: #6fa1ff; --s3: #b192f5; --s4: #f0ad4e; --s5: #f472b6; --s6: #2dd4bf;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 15px; height: 15px; }
.i.lg { width: 22px; height: 22px; }
.mono { font-family: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.hidden { display: none !important; }

/* Frame: the sidebar and the page */
#app { display: flex; min-height: 100%; }
.side {
  width: 232px; flex: none; background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 18px 12px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 20px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: var(--muted); margin-top: -2px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; color: var(--muted);
  font-weight: 500; text-decoration: none; position: relative;
}
.nav a:hover { background: var(--hover); color: var(--text); }
.nav a.on { background: var(--accent-soft); color: var(--accent-text); }
.nav .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--faint); }
.nav a.on .count { color: var(--accent-text); }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.side-foot .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.side-foot b { color: var(--text); font-weight: 600; }
.side-link { display: flex; align-items: center; gap: 8px; width: 100%; margin: 0 0 8px -2px; padding: 7px 8px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: inherit; font-weight: 550; cursor: pointer; }
.side-link:hover { background: var(--hover); color: var(--text); }
.releases { display: grid; gap: 10px; }
.release { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-decoration: none; }
.release:hover { border-color: var(--accent); background: var(--hover); }
.release .icon { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.release .text { flex: 1; min-width: 0; }
.release .title { font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.release .title .muted { font-size: 12.5px; font-weight: 500; }
.release .help { color: var(--muted); font-size: 13px; margin-top: 2px; }
main { flex: 1; min-width: 0; }
.page { max-width: 1240px; margin: 0 auto; padding: 28px 32px 48px; }
.head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.head h1 { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
.head p { margin: 4px 0 0; color: var(--muted); }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.topbar { display: none; }

/* Pieces */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; }
.card-head h2 { font-size: 15px; font-weight: 620; margin: 0; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-body { padding: 14px 18px 18px; }
.card-foot { padding: 12px 18px 14px; border-top: 1px solid var(--line); font-size: 13px; }
.grid { display: grid; gap: 16px; }
.tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack > :empty { display: none; }
.tile { padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
.tile .label .i { color: var(--faint); }
.tile .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .value small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.tile .note { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .note.warn { color: var(--warn); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-weight: 550;
  white-space: nowrap; text-decoration: none !important; color: var(--text);
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.icon { width: 34px; padding: 0; }
.btn.small { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .nav a:focus-visible, input:focus-visible, select:focus-visible, .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.play { background: var(--play-soft); color: var(--play); }
.pill.off { background: var(--hover); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.good { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.dot.play { background: var(--play); box-shadow: 0 0 0 3px var(--play-soft); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.empty { padding: 34px 18px; text-align: center; color: var(--muted); }
.empty .i { width: 30px; height: 30px; color: var(--faint); margin-bottom: 8px; }
.empty h3 { margin: 0 0 4px; font-size: 15px; color: var(--text); font-weight: 600; }
.empty p { margin: 0 auto 14px; max-width: 420px; }
code, .code { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--hover); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-weight: 550; font-size: 13px; }
.field .help { color: var(--muted); font-size: 12.5px; }
.input, select.input {
  height: 36px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--field); width: 100%; min-width: 0;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-icon { position: relative; }
.input-icon .i { position: absolute; left: 10px; top: 9px; color: var(--faint); }
.input-icon .input { padding-left: 34px; }
.form { display: grid; gap: 16px; }
.form.cols { grid-template-columns: 1fr 1fr; }
.form-actions { display: flex; gap: 8px; align-items: center; }
.form-actions .note { color: var(--muted); font-size: 13px; }
.setting { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.setting:first-child { border-top: 0; padding-top: 2px; }
.setting .text { flex: 1; min-width: 0; }
.setting .title { font-weight: 550; }
.setting .help { color: var(--muted); font-size: 13px; margin-top: 2px; }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line-strong); transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:disabled + span { opacity: .5; }
.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; padding: 2px; gap: 2px; background: var(--field); }
.segmented button { border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 550; display: inline-flex; align-items: center; gap: 6px; }
.segmented button.on { background: var(--accent-soft); color: var(--accent-text); }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
.radio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio input { margin: 3px 0 0; accent-color: var(--accent); }
.radio .title { font-weight: 550; }
.radio .help { color: var(--muted); font-size: 13px; }

/* Dashboard */
.notice { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 550; }
.notice span { flex: 1; }
.setup { padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 14px; }
.setup h2 { margin: 0; font-size: 16px; font-weight: 640; }
.setup .lead { color: var(--muted); margin: 3px 0 0; }
.steps { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
.step.done { background: var(--accent-soft); border-color: transparent; }
.step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 13px; border: 2px solid var(--line-strong); color: var(--muted); }
.step.done .n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step .t { font-weight: 600; }
.step .d { color: var(--muted); font-size: 13px; }
.step.done .d { color: var(--accent-text); }
.step .btn { align-self: flex-start; margin-top: auto; }
.chart-wrap { position: relative; height: 230px; margin: 4px 0 0; }
.chart-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart-tip {
  position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-pop);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 150px; z-index: 2;
}
.chart-tip .row { display: flex; align-items: center; gap: 8px; }
.chart-tip .row b { margin-left: auto; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.events { list-style: none; margin: 0; padding: 4px 0 0; }
.events li { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: flex-start; }
.events li:first-child { border-top: 0; }
.events .badge { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.events .badge .i { width: 15px; height: 15px; }
.k-good { background: var(--good-soft); color: var(--good); }
.k-play { background: var(--play-soft); color: var(--play); }
.k-xbox { background: var(--info-soft); color: var(--info); }
.k-info { background: var(--hover); color: var(--muted); }
.k-warning { background: var(--warn-soft); color: var(--warn); }
.events .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.events .when { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.consoles { display: grid; gap: 12px; }
.console { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; align-items: center; background: var(--panel); }
.console .icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--hover); color: var(--muted); grid-row: span 2; }
.console.on .icon { background: var(--good-soft); color: var(--good); }
.console.playing .icon { background: var(--play-soft); color: var(--play); }
.console .name { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.console .what { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.console .what b { color: var(--text); font-weight: 600; }
.console .rate { text-align: right; grid-row: span 2; }
.console .rate .v { font-weight: 650; font-size: 15px; white-space: nowrap; }
.console .rate .s { color: var(--faint); font-size: 12px; }
.console canvas { width: 110px; height: 30px; display: block; margin-left: auto; }
.console-wide { grid-template-columns: auto 1fr auto; }
.console-events { grid-column: 1 / -1; margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
.console-events .events li { padding: 6px 0; border-top: 0; align-items: center; font-size: 13px; }
.console-events .events .badge { width: 22px; height: 22px; border-radius: 6px; }
.console-events .events .badge .i { width: 13px; height: 13px; }
.console-events h3 { margin: 4px 0 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.console-facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.fact .k { color: var(--faint); font-size: 12px; }
.fact .v { font-weight: 550; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fact .v.good { color: var(--good); } .fact .v.warn { color: var(--warn); } .fact .v.bad { color: var(--bad); }

/* Games */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar .search { flex: 1 1 240px; max-width: 360px; }
.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 16px; }
.game { cursor: pointer; min-width: 0; border-radius: 10px; }
.game:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cover {
  position: relative; aspect-ratio: 0.705; border-radius: 9px; overflow: hidden; background: var(--hover);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.cover img { position: absolute; top: 0; height: 100%; opacity: 0; transition: opacity .2s; }
.cover img.box { right: 0; width: auto; }
.cover img.front { left: 0; width: 100%; object-fit: cover; }
.cover img.ready { opacity: 1; }
.cover .art {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
  background: linear-gradient(160deg, var(--a1), var(--a2)); color: #fff;
}
.cover .art .t { font-weight: 650; font-size: 14px; line-height: 1.25; text-shadow: 0 1px 2px rgba(0,0,0,.3); overflow-wrap: anywhere; }
.cover .art .ring { position: absolute; right: -26px; top: -26px; width: 110px; height: 110px; border-radius: 50%; border: 14px solid rgba(255,255,255,.14); }
.cover .tag { position: absolute; left: 8px; top: 8px; z-index: 1; }
.cover .now { position: absolute; left: 8px; bottom: 8px; right: 8px; z-index: 1; }
.cover .now .pill { background: var(--play); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 100%; overflow: hidden; }
.cover .start {
  position: absolute; right: 8px; bottom: 8px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0;
  display: grid; place-items: center; background: var(--accent); color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  cursor: pointer; opacity: 0; transform: scale(.9); transition: opacity .15s, transform .15s;
}
.game:hover .cover .start, .game:focus-within .cover .start { opacity: 1; transform: none; }
.cover .start:focus-visible { opacity: 1; outline: 2px solid #fff; outline-offset: 2px; }
@media (hover: none) { .cover .start { opacity: 1; transform: none; } }
.cover .now ~ .start { bottom: 40px; }
.cover .tag { display: flex; gap: 4px; flex-wrap: wrap; }
.kind.warn { background: var(--warn); color: var(--panel); }
/* A newer title update than a console has: a button on the cover that puts it on. */
button.kind.tu { border: 0; cursor: pointer; gap: 3px; padding: 0 7px 0 5px; background: var(--info); color: var(--panel); font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
button.kind.tu .i { width: 12px; height: 12px; }
button.kind.tu:hover { filter: brightness(1.1); }
button.kind.tu:disabled { opacity: .6; cursor: default; }
button.kind.tu:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
button.pill.tu { border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; background: var(--info-soft); color: var(--info); }
button.pill.tu:hover { background: var(--info); color: var(--panel); }
button.pill.tu:disabled { opacity: .6; cursor: default; }
.tu-notice { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; padding: 12px 16px; }
.tu-notice > .i { color: var(--info); flex: none; }
.tu-notice .what { flex: 1; min-width: 220px; }
.tu-notice .what .muted { display: block; font-size: 12.5px; margin-top: 2px; }
.console-live { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.console-live .stat { display: inline-flex; align-items: center; gap: 6px; }
.console-live .stat b { color: var(--text); font-weight: 600; }
.console-live .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.shot { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--hover); cursor: pointer; padding: 0; text-align: left; color: inherit; font: inherit; }
.shot:hover { border-color: var(--accent); }
.shot .pic { aspect-ratio: 16 / 9; display: grid; place-items: center; color: var(--faint); }
.shot .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .cap { padding: 6px 8px; font-size: 12px; color: var(--muted); background: var(--panel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shot-big img { width: 100%; border-radius: 8px; display: block; background: var(--hover); }
.logtext { margin: 0; max-height: 60vh; overflow: auto; background: var(--hover); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.game:hover .cover { border-color: var(--accent); }
.game .name { font-weight: 600; margin-top: 8px; font-size: 13.5px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.game .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.kind { font-size: 11px; font-weight: 700; letter-spacing: .03em; height: 20px; padding: 0 7px; border-radius: 6px; display: inline-flex; align-items: center; background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(4px); }
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr.click:hover td { background: var(--hover); }
.table .path { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.table .num { text-align: right; white-space: nowrap; }
.thumb { width: 34px; height: 48px; border-radius: 5px; position: relative; overflow: hidden; background: var(--hover); flex: none; border: 1px solid var(--line); }
.thumb .art { padding: 0; }
.thumb .art .t, .thumb .art .ring { display: none; }
.cell-name { display: flex; gap: 12px; align-items: center; font-weight: 600; }
.kind-text { font-size: 12px; font-weight: 650; color: var(--muted); }
.nav .count .flag { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--warn); color: var(--panel); font-size: 11.5px; font-weight: 700; }
.conflicts .card-body { padding-top: 4px; padding-bottom: 4px; }
.conflict { padding: 14px 0; border-top: 1px solid var(--line); }
.conflict:first-child { border-top: 0; }
.conflict-head { display: flex; align-items: center; gap: 12px; }
.conflict-head .what { flex: 1; min-width: 0; }
.conflict-head .what b { overflow-wrap: anywhere; }
.conflict-head .what .muted { font-size: 12.5px; }
.copies { list-style: none; margin: 10px 0 0 46px; padding: 0; display: grid; gap: 6px; }
.copies li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; }
.copies li.on { border-color: var(--line-strong); background: var(--hover); }
.copies .kind-text { width: 68px; flex: none; }
.copies .size { width: 64px; flex: none; font-size: 12.5px; color: var(--muted); }
.copies .path { flex: 1 1 200px; min-width: 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 640px) { .copies { margin-left: 0; } }

/* Folders and the folder browser */
.folder-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--line); }
.folder-row:first-child { border-top: 0; }
.folder-row .icon { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.folder-row.missing .icon { background: var(--bad-soft); color: var(--bad); }
.folder-row .path { font-weight: 600; overflow-wrap: anywhere; }
.folder-row .sub { color: var(--muted); font-size: 13px; }
.folder-row .grow { flex: 1; min-width: 0; }
.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow-pop); width: min(760px, 100%); max-height: min(640px, calc(100vh - 40px)); display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal.narrow { width: min(520px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 16px; font-weight: 640; }
.modal-head .btn { margin-left: auto; }
.modal-body { padding: 16px 18px; overflow: auto; flex: 1; min-height: 0; }
.modal-foot { display: flex; gap: 8px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.modal-foot .note { color: var(--muted); font-size: 13px; margin-right: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
.browser { display: grid; grid-template-columns: 170px 1fr; gap: 14px; min-height: 340px; }
.places { display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); padding-right: 12px; }
.places button, .listing button {
  display: flex; align-items: center; gap: 10px; border: 0; background: transparent; text-align: left; padding: 7px 9px; border-radius: 7px; cursor: pointer; color: var(--text); width: 100%;
}
.places button:hover, .listing button:hover { background: var(--hover); }
.places button .i, .listing button .i { color: var(--faint); }
.listing button .i { color: var(--accent-text); }
.crumbs { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.crumbs .input { font-family: "Cascadia Mono", Consolas, Menlo, monospace; font-size: 12.5px; }
.listing { display: flex; flex-direction: column; max-height: 360px; overflow: auto; }
.detail-cover { width: 180px; flex: none; }
.detail { display: flex; gap: 20px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13.5px; align-content: start; }
.facts .k { color: var(--muted); }
.facts .v { overflow-wrap: anywhere; }
.install-box { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; font-size: 13.5px; display: grid; gap: 8px; }
.install-box p { margin: 0; }
.install-head { display: flex; align-items: center; gap: 8px; }
.install-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
.install-line.good { color: var(--good); justify-content: flex-start; } .install-line.bad { color: var(--bad); justify-content: flex-start; } .install-line.muted { justify-content: flex-start; }
.install-box .progress { margin-top: 0; }
.tu-files { display: grid; gap: 4px; margin: 2px 0 6px 14px; padding-left: 10px; border-left: 2px solid var(--line); }
.tu-files .install-line { font-size: 13px; }
.tu-on { color: var(--good); font-weight: 600; } .tu-off { color: var(--muted); }
.install-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.install-actions .muted { margin-right: auto; font-size: 12.5px; }

/* Settings */
.settings { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }
.subnav { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 2px; }
.subnav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); font-weight: 550; text-decoration: none; border: 1px solid transparent; white-space: nowrap; }
.subnav a:hover { background: var(--hover); color: var(--text); }
.subnav a.on { background: var(--panel); color: var(--text); border-color: var(--line); box-shadow: var(--shadow); }
.subnav a.on .i { color: var(--accent-text); }
.subnav .new { margin-left: auto; }
.section-head { margin: 2px 0 2px; }
.section-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.section-head p { margin: 3px 0 0; color: var(--muted); }
.hero { display: flex; gap: 16px; align-items: center; padding: 20px; }
.hero .mark { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.hero .mark .i { width: 24px; height: 24px; }
.hero .text { flex: 1; min-width: 0; }
.hero h3 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.hero p { margin: 3px 0 0; color: var(--muted); }
.hero .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.hero .brand-mark { width: 48px; height: 48px; display: block; }
.hero-foot { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.hero-foot b { color: var(--text); font-weight: 600; }
.progress { height: 8px; border-radius: 99px; background: var(--hover); overflow: hidden; margin-top: 10px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
.progress.busy i { width: 35%; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.notes { overflow-wrap: anywhere; }
.notes h3, .notes h4 { margin: 16px 0 6px; font-size: 14px; font-weight: 650; }
.notes > :first-child { margin-top: 0; }
.notes p { margin: 6px 0; }
.notes ul { margin: 6px 0; padding-left: 20px; }
.notes li { margin: 3px 0; }
.change { padding: 16px 0; border-top: 1px solid var(--line); }
.change:first-child { padding-top: 0; border-top: 0; }
.change-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.change-head b { font-size: 15px; font-weight: 650; }
.change-head .sub { color: var(--muted); font-size: 13px; }
.earlier { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.earlier summary { cursor: pointer; color: var(--muted); font-weight: 600; }
.earlier[open] summary { margin-bottom: 12px; }
.earlier summary + .change { padding-top: 0; border-top: 0; }
.history-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.history-row:first-child { padding-top: 0; border-top: 0; }
.history-row .kindmark { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.history-row .grow { flex: 1; min-width: 0; }
.history-row .sub { color: var(--muted); font-size: 13px; }
.command { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 9px; background: var(--field); border: 1px solid var(--line-strong); }
.command code { flex: 1; min-width: 0; background: none; border: 0; padding: 0; overflow-x: auto; white-space: nowrap; }
.backup-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--line); }
.backup-row:first-child { border-top: 0; }
.backup-row .kindmark { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.backup-row .grow { flex: 1; min-width: 0; }
.backup-row .sub { color: var(--muted); font-size: 13px; }
.backup-row .when { font-weight: 600; }
.link { display: inline-flex; align-items: center; gap: 5px; }
.backup-row .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.flag.new, .pill.new { background: var(--info); color: var(--panel); }
.nav .count .flag.new { background: var(--info); }
.notice.info { background: var(--info-soft); color: var(--info); }

/* Log */
.log { height: calc(100vh - 230px); min-height: 320px; overflow: auto; padding: 10px 0; background: var(--field); border-radius: 0 0 12px 12px; }
.log div { padding: 1px 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.log div:hover { background: var(--hover); }
.log .t { color: var(--faint); margin-right: 10px; user-select: none; }
.log .warn { color: var(--warn); }
.log .xbox { color: var(--info); font-weight: 600; }

/* The setup wizard */
.wizard { flex: 1; min-height: 100vh; display: grid; place-items: center; padding: 28px 20px; }
.wz-card { width: min(980px, 100%); height: min(700px, calc(100vh - 56px)); display: grid; grid-template-columns: 240px minmax(0, 1fr); overflow: hidden; }
.wz-side { background: var(--side); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; }
.wz-side .brand { padding: 2px 8px 22px; }
.wz-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; counter-reset: step; }
.wz-steps li { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; color: var(--faint); font-weight: 550; white-space: nowrap; }
.wz-steps .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-strong); flex: none; }
.wz-steps li.done { color: var(--muted); }
.wz-steps li.done .n { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
.wz-steps li.on { background: var(--accent-soft); color: var(--accent-text); }
.wz-steps li.on .n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.wz-progress { margin-top: auto; height: 6px; border-radius: 99px; background: var(--hover); overflow: hidden; }
.wz-progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.wz-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.wz-body { flex: 1; overflow: auto; padding: 30px 34px 24px; display: flex; flex-direction: column; gap: 16px; animation: wz-in .25s ease-out; }
@keyframes wz-in { from { opacity: 0; transform: translateX(10px); } }
.wz-foot { display: flex; gap: 8px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--line); }
.wz-foot .grow, .wz-row .grow { flex: 1; }
.wz-head h2 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -.02em; }
.wz-head p { margin: 6px 0 0; color: var(--muted); max-width: 620px; }
.wz-hero { text-align: center; padding: 18px 0 4px; }
.wz-hero h1 { margin: 14px 0 6px; font-size: 26px; font-weight: 680; letter-spacing: -.02em; }
.wz-hero p { margin: 0 auto; color: var(--muted); max-width: 480px; font-size: 15px; }
.wz-mark { width: 64px; height: 64px; margin: 0 auto; display: grid; place-items: center; }
.wz-mark .brand-mark { width: 64px; height: 64px; }
.wz-mark.done { border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); }
.wz-mark.done .i { width: 30px; height: 30px; }
.wz-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wz-list li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.wz-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.wz-list li b { display: block; }
.wz-list li .muted { font-size: 13px; }
.wz-alt { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--hover); color: var(--muted); flex-wrap: wrap; }
.wz-alt span { flex: 1; min-width: 200px; }
.wz-box { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.wz-box h3 { margin: 0; font-size: 14.5px; font-weight: 620; }
.wz-box > p { margin: 8px 0; }
.wz-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wz-typed { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.wz-found { display: grid; gap: 8px; margin-top: 12px; }
.wz-console { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.wz-console.on { border-color: var(--accent); background: var(--accent-soft); }
.wz-console .icon { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--hover); color: var(--muted); flex: none; }
.wz-console.on .icon { background: var(--accent); color: var(--on-accent); }
.wz-console .grow { flex: 1; min-width: 0; }
.wz-console .sub { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 12.5px; }
.wz-scan { display: flex; align-items: center; gap: 14px; padding: 14px 4px; }
.wz-radar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; position: relative; }
.wz-radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ping 1.4s ease-out infinite; }
@keyframes ping { from { transform: scale(.8); opacity: .8; } to { transform: scale(1.6); opacity: 0; } }
.wz-status { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--info-soft); color: var(--info); }
.wz-status.good { background: var(--good-soft); color: var(--good); }
.wz-status b { font-weight: 650; }
.wz-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.wz-check { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.wz-check .badge { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.wz-check.good .badge { background: var(--good-soft); color: var(--good); }
.wz-check.warn .badge { background: var(--warn-soft); color: var(--warn); }
.wz-check.bad .badge { background: var(--bad-soft); color: var(--bad); }
.wz-check.info .badge { background: var(--hover); color: var(--muted); }
.wz-check .t { font-weight: 580; padding-top: 3px; }
.wz-check .d { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.wz-folders { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.wz-total { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.wz-total b { color: var(--text); }
.wz-how { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.wz-preset, .wz-note { display: flex; gap: 8px; align-items: center; color: var(--info); background: var(--info-soft); padding: 9px 12px; border-radius: 9px; font-size: 13px; margin: 0; }
.wz-note { color: var(--muted); background: var(--hover); }
.wz-problem { color: var(--bad); font-weight: 550; min-height: 1px; }
.wz-problem:empty { display: none; }
.wz-extras { padding: 0; }
.wz-extras .setting:first-child { padding-top: 0; }
.wz-wait { display: grid; }
/* Login, toasts */
.console-speed { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .card { width: min(380px, 100%); padding: 28px; }
.login h1 { font-size: 20px; margin: 16px 0 4px; }
#toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--text); color: var(--bg); border-radius: 10px; padding: 11px 14px; box-shadow: var(--shadow-pop); display: flex; gap: 10px; align-items: center; max-width: 420px; animation: rise .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.offline-bar { background: var(--warn-soft); color: var(--warn); padding: 8px 32px; font-weight: 550; display: flex; align-items: center; gap: 8px; }

@media (max-width: 1100px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two { grid-template-columns: minmax(0, 1fr); }
  .console-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  #app { flex-direction: column; }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 10; background: var(--side); border-bottom: 1px solid var(--line); padding: 8px 12px; gap: 4px; overflow-x: auto; align-items: center; }
  .topbar .brand-mark { width: 26px; height: 26px; margin-right: 6px; }
  .topbar a { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px; color: var(--muted); white-space: nowrap; font-weight: 550; font-size: 13px; text-decoration: none; }
  .topbar a.on { background: var(--accent-soft); color: var(--accent-text); }
  .page { padding: 18px 16px 40px; }
  .steps { grid-template-columns: 1fr; }
  .form.cols { grid-template-columns: 1fr; }
  .browser { grid-template-columns: 1fr; }
  .places { flex-direction: row; flex-wrap: wrap; border-right: 0; padding-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .places button { width: auto; }
  .detail { flex-direction: column; }
  .settings { grid-template-columns: minmax(0, 1fr); gap: 16px; }

<body>

<script>
'use strict';
// Helpers ----------------------------------------------------------------------

const $ = (selector, root) => (root || document).querySelector(selector);

// h('div.card', {onclick: ...}, 'text', child, ...): an element; strings become text, never HTML.

async function api(path, body) {

  const options = body === undefined ? { headers: { 'X-NetDisc': '1' } } : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-NetDisc': '1' }, body: JSON.stringify(body) };

  catch (e) { throw new Error('NetDisc360 isn\u2019t answering. Is it still running?'); }

  if (response.status === 401 && path !== 'login') { showLogin(); throw new Error('Log in first.'); }

async function save(changes, done) {

  catch (e) { toast(e.message, true); return false; }
}

// Theme: the system's, or light or dark, kept in this browser.
function applyTheme() {

  const dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);

// the Xbox gets its art from Aurora.
const Archive = 'https://raw.githubusercontent.com/UncreativeXenon/XboxUnity-Scraper/master/Covers/';
const coverIds = {};

  if (!coverIds[titleId]) {
    const known = store('cover.' + titleId);
    if (known && (known !== 'none' || Date.now() - (+store('cover.' + titleId + '.at') || 0) < 7 * 864e5)) coverIds[titleId] = Promise.resolve(known);
    else coverIds[titleId] = fetch(Archive + titleId + '/metadata.json').then(r => r.ok ? r.json() : { Covers: [] }).then(meta => {
      const covers = (meta.Covers || []).filter(c => /^\d+$/.test(c.CoverID));
      covers.sort((a, b) => (b.Official === '1') - (a.Official === '1') || (+b.Rating || 0) - (+a.Rating || 0));
      const id = covers.length ? covers[0].CoverID : 'none';

    h('div.art', { style: { '--a1': `hsl(${k} 45% 38%)`, '--a2': `hsl(${(k + 40) % 360} 55% 22%)` } }, h('div.ring'), h('div.t', game.name)));

  ['dashboard', 'Dashboard', 'layout-dashboard'],
  ['games', 'Games', 'gamepad-2'],
  ['updates', 'Title updates', 'refresh-cw'],
  ['consoles', 'Consoles', 'monitor'],
  ['folders', 'Game folders', 'folder'],
  ['log', 'Log', 'scroll-text'],
  ['settings', 'Settings', 'settings'],

async function refresh() {

// The frame: sidebar, top bar on small screens, and the page.

    h('aside.side',
      h('div.brand', mark(), h('div', h('div.brand-name', 'NetDisc360'), h('div.brand-sub', 'NetISO server for Aurora'))),
      h('nav.nav', nav),
      h('div.side-foot', h('button.side-link', { onclick: releases }, ic('download', 'sm'), 'Latest releases'),
        h('div.row', h('span.dot#server-dot'), h('span#server-state')), h('div.row.muted#server-address'), h('a.row.muted#sync-state', { href: '#settings/sync', hidden: true }))),
    h('main',
      h('nav.topbar', mark(), Nav.map(([id, label, icon]) => h('a', { href: '#' + id, 'data-page': id }, ic(icon, 'sm'), label)),

// when the server knows more (a look-up, a check) or the games or the
// consoles' tiles changed.
function loadTus() {
  if (!S || !S.titleUpdates) return;
  const key = [S.titleUpdates.version, S.library.version, S.consoles.map(c => c.address + ':' + c.synced).join()].join('/');
  if (key === T.key || tuAsking) return;

function tuTitle(b) {

    b.behind.map(c => c.address + (c.has ? ' has ' + c.has : ' has none')).join(', ') + '. Click to put it on ' + (b.behind.length > 1 ? 'them' : 'it') + '.';

// Charts --------------------------------------------------------------------------

let charts = [];

// The bandwidth chart: each console's last two minutes, each line its own rate

    if (waiting.length) fill(open, h('div.card.conflicts', { style: { marginBottom: '20px' } },
      h('div.card-head', ic('copy', 'sm'), h('h2', 'Choose which copy to play'), h('span.sub', waiting.length === 1 ? 'this game is in your folders more than once' : 'these games are in your folders more than once')),
      h('div.card-body', waiting.map(conflict)),
      h('div.card-foot', { style: { display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap' } }, h('span.muted', { style: { flex: 1, minWidth: '220px' } }, 'Until you choose, an ISO plays first, then a Games on Demand copy, then an extracted one. NetDisc360 remembers your choice, and asks again if another copy turns up.'),
        waiting.length > 1 ? h('button.btn.small', { onclick: e => keepAll(waiting, e.currentTarget) }, ic('check', 'sm'), 'Keep the copies that play now') : null)));
    else open.replaceChildren();
    if (settled.length) fill(dupes, h('div.card.conflicts', { style: { marginTop: '20px' } },
      h('div.card-head', ic('copy', 'sm'), h('h2', 'Games with more than one copy'), h('span.sub', 'the copy you chose plays')),
      h('div.card-body', settled.map(conflict)),
      h('div.card-foot.muted', 'Delete the copies you don\u2019t play from your folders to free up space.')));
    else dupes.replaceChildren();
  }
  return { update: draw, games: draw, tus: draw };
};

// Chooses the copy that plays now for each of these games.
async function keepAll(list, button) {
  button.disabled = true;
  let done = 0;
  for (const c of list) {
    try { await api('conflict', { key: c.key, path: c.served }); done++; }
    catch (e) { toast(c.name + ': ' + e.message, true); }
  }
  toast(plural(done, 'game') + ' keep the copy that plays now');
  await refresh();
}

// How often and how long a game was played; short: for under its cover.
function playedText(g, short) {
  if (!g.plays) return short ? 'Not played yet' : 'Not yet';
  const time = g.played >= 60 ? duration(g.played) : 'under a minute';
  return short ? plural(g.plays, 'time') + ' \u00b7 ' + time : plural(g.plays, 'time') + ', ' + time + ' in all \u00b7 last ' + ago(g.lastPlayed);
}

const choosePhrase = n => n === 1 ? '1 game to choose a copy of' : n + ' games to choose a copy of';

// One game that is in the folders more than once, with a button to play each copy.
function conflict(c) {
  const first = c.copies[0];
  return h('div.conflict',
    h('div.conflict-head', cover({ name: c.name, titleId: first.titleId }, true),
      h('div.what', h('b', c.name), h('div.muted', 'Title ID ' + first.titleId + (first.disc > 1 ? ' \u00b7 Disc ' + first.disc : '') + ' \u00b7 ' + plural(c.copies.length, 'copy', 'copies'))),
      c.open ? h('span.pill.warn', ic('triangle-alert', 'sm'), 'Choose a copy') : h('span.pill.good', ic('check', 'sm'), 'Chosen')),
    h('ul.copies', c.copies.map(g => {
      const served = g.path === c.served;
      return h('li' + (served ? '.on' : ''),
        h('span.kind-text', KindNames[g.kind]), h('span.size', g.sizeKnown ? bytes(g.size) : '\u2026'), h('span.path', g.path),
        served ? h('span.pill' + (c.open ? '.info' : '.good'), ic('play', 'sm'), 'Plays now') : null,
        served && c.open ? h('button.btn.small.primary', { onclick: e => choose(c, g, e.target) }, 'Keep this one') : null,
        served ? null : h('button.btn.small', { onclick: e => choose(c, g, e.target) }, 'Play this one'));
    })));
}

async function choose(c, g, button) {
  button.disabled = true;
  try {
    await api('conflict', { key: c.key, path: g.path });
    toast(c.name + ': the ' + { iso: 'ISO', folder: 'extracted', god: 'Games on Demand' }[g.kind] + ' copy plays from now on');
    await refresh();
  } catch (e) { toast(e.message, true); button.disabled = false; }
}

// Things open on top of a page (a game's install progress) that follow each refresh.
const live = new Set();

// A box on a game's page that copies something to a console's hard drive
// over Aurora's FTP and follows it: o.kind is the job kind in S.installs,
// o.call the API to start it, o.what the text above it, o.note the line
// beside its button, o.button the button's text, o.verb and o.unit what
// the progress line says ("Installing", "package"), o.done the line once done.
function transferBox(g, o) {
  const box = h('div.install-box');
  let chosen = null, starting = false, drawn = '';
  const pick = () => {
    const list = S.consoles.filter(c => !c.offline);
    if (chosen && list.some(c => c.address === chosen)) return chosen;
    const best = list.slice().sort((a, b) => (b.connections > 0) - (a.connections > 0) || (b.inAurora - a.inAurora) || lastSeen(b) - lastSeen(a))[0];
    return best ? best.address : null;
  };
  async function start(button, extra) {
    starting = true; button.disabled = true;
    try { await api(o.call, Object.assign({ game: g.name, address: chosen }, extra || {})); await refresh(); }
    catch (e) { toast(e.message, true); }
    starting = false; draw();
  }
  async function stop(button, job) {
    button.disabled = true;
    try { await api('install/stop', job.state === 'queued' ? { id: job.id } : { address: chosen }); await refresh(); }
    catch (e) { toast(e.message, true); button.disabled = false; }
  }
  function draw() {
    chosen = pick();
    // The latest of this game's jobs on the console: those waiting first, then the one running.
    const jobs = (S.installs || []).filter(j => j.address === chosen && o.kinds.includes(j.kind || 'content') && o.match(j));
    const job = jobs.find(j => j.state === 'copying') || jobs.filter(j => j.state === 'queued')[0] || jobs[jobs.length - 1];
    const waiting = jobs.filter(j => j.state === 'queued' || j.state === 'copying').length;
    // Drawn again only when something shows a change, so the console list stays open.
    const key = JSON.stringify([job, waiting, S.consoles.map(c => c.address), chosen, starting]);
    if (key === drawn) return;
    drawn = key;
    const picker = S.consoles.length > 1 ? h('select.input', { style: { width: 'auto', height: '28px', padding: '0 8px' }, 'aria-label': 'Console', onchange: e => { chosen = e.target.value; draw(); } },
      S.consoles.map(c => h('option', { value: c.address, selected: c.address === chosen }, c.address))) : null;
    const what = j => j.label && j.label !== g.name ? j.label : o.unitName;
    let body;
    if (job && job.state === 'copying') {
      const left = job.rate > 0 ? (job.total - job.done) / job.rate : 0;
      const doing = job.phase === 'prepare' ? 'Getting it ready: reading the game for its Games on Demand files'
        : job.phase === 'download' ? 'Downloading ' + what(job) + ' from XboxUnity'
        : o.verb + ' ' + what(job) + ' to ' + job.address + (job.files > 1 ? ': ' + o.unit + ' ' + job.file + ' of ' + job.files : '');
      body = [h('div.install-line', h('span', doing),
          h('span.muted', bytes(job.done, 1) + ' of ' + bytes(job.total, 1) + (job.rate > 0 ? ' · ' + rate(job.rate) + ' · about ' + duration(left) + ' left' : ''))),
        h('div.progress', h('i', { style: { width: (job.total ? Math.floor(100 * job.done / job.total) : 0) + '%' } })),
        h('div.install-actions', h('span.muted', 'Leave the console in Aurora until it’s done. You can close this.' + (waiting > 1 ? ' ' + plural(waiting - 1, 'more waits', 'more wait') + ' after it.' : '')),
          h('button.btn.small', { onclick: e => stop(e.target, job) }, ic('x', 'sm'), 'Stop'))];
    } else if (job && job.state === 'queued') {
      body = [h('div.install-line.muted', ic('history', 'sm'), h('span', what(job) + ' waits its turn on ' + job.address + (job.place > 1 ? ': ' + (job.place - 1) + ' before it' : ': it’s next') + '. Things copied to a console go one at a time.')),
        h('div.install-actions', h('span.muted', o.note), h('button.btn.small', { onclick: e => stop(e.target, job) }, ic('x', 'sm'), 'Take it out of the line'))];
    } else {
      const done = job && job.state === 'done', ready = !!chosen;
      const extra = o.extra ? o.extra(ready && !starting, (button, body) => start(button, body)) : null;
      body = [job ? h('div.install-line.' + (done ? 'good' : job.state === 'stopped' ? 'muted' : 'bad'), ic(done ? 'circle-check' : job.state === 'stopped' ? 'info' : 'circle-alert', 'sm'),
          h('span', done ? o.done(job) + (job.note ? ' ' + job.note : '') : job.state === 'stopped' ? 'Stopped. Whole ' + o.unit + 's stay on the console; the rest is copied next time.' : job.error || 'It stopped.')) : null,
        h('div.install-actions', h('span.muted', ready ? o.note : 'No console yet.'),
          picker, extra, done ? null : h('button.btn.small.primary', { disabled: !ready || starting, onclick: e => start(e.target) }, ic('download', 'sm'), job ? 'Try again' : o.button))];
    }
    fill(box, h('div.install-head', ic('hard-drive', 'sm'), h('b', o.title)), o.what, body);
  }
  draw();
  return [box, draw];
}

// Copy to Xbox: the whole game on the console's hard drive, so it plays
// there without this server or the network. A 360 game goes as Games on
// Demand, with its install disc's content if it has one; an install disc
// copies its content; an original Xbox game its files, extracted.
function copyBox(g) {
  const others = g.titleId ? G.games.filter(x => x.titleId === g.titleId && x.name !== g.name) : [];
  const carrier = !g.packages && g.installDisc ? G.games.find(x => x.name === g.installDisc && x.packages) : null;
  const contentOnly = g.packages && (g.role === 'install' || g.role === 'content' || !g.mediaId);
  const xbox1 = g.titleId && !g.mediaId && !contentOnly;
  const all = others.length ? (enabled, start) => h('button.btn.small', { disabled: !enabled, title: 'Every disc of this game, one after another', onclick: e => start(e.target, { all: true }) },
    ic('download', 'sm'), 'Copy all ' + (others.length + 1) + ' discs') : null;
  let what, note;
  if (contentOnly) {
    what = h('p', ['This disc carries ', h('b', plural(g.packages, 'package') + ', ' + bytes(g.contentSize, 1)), ' of content that its game needs on the console’s hard drive.']);
    note = 'Copied over Aurora’s FTP to Hdd1:\\Content, where the console installs it too. Packages already there are skipped.';
  } else if (xbox1) {
    what = h('p', ['Puts this original Xbox game on the console’s hard drive as an extracted game, ', g.sizeKnown ? h('b', bytes(g.size, 1)) : 'its full size', ', in Hdd1:\\Games. Aurora starts it in the console’s emulator, without the network.']);
    note = 'Its files are sent over Aurora’s FTP. Files already there are skipped, so a stopped copy goes on where it was.';
  } else {
    what = h('p', ['Puts the whole game on the console’s hard drive as Games on Demand, ', g.sizeKnown ? h('b', 'up to ' + bytes(g.size, 1)) : 'its full size', ', so it plays without this server or the network. Aurora lists it by itself.',
      carrier ? [' Its content from ', h('b', carrier.name), ' (' + bytes(carrier.contentSize, 1) + ') comes along.'] : null]);
    note = 'Made into Games on Demand files while it’s sent over Aurora’s FTP, to Hdd1:\\Content. Nothing is written on this computer. A stopped copy goes on where it was.';
  }
  return transferBox(g, {
    kinds: ['game', 'content', 'files'], call: 'copy', title: 'Copy to the Xbox', button: 'Copy to Xbox', verb: 'Copying', unit: 'file', unitName: g.name,
    match: j => j.game === g.name || j.disc === g.name, extra: all, what, note,
    done: job => (job.kind === 'content' ? job.disc + '’s content is on ' : 'On ') + job.address + (job.kind === 'content' ? '' : '’s hard drive') + (job.skipped === job.files ? ' (it was there already)' : '') + '.' + (job.kind === 'content' ? '' : ' Aurora lists it once it has scanned.'),
  });
}

// What a console has of a game's title updates, as tuBox and the Title updates page say it.
function tuState(c, offers) {
  if (!c.checked) return ['Not checked yet', 'muted'];
  if (c.has && offers.length && c.has === offers[0].id) return ['Has ' + c.hasName + ', the newest', 'good'];
  if (offers.length && (c.files || []).some(f => !f.on && f.offer === offers[0].id))
    return [(c.has ? 'Has ' + c.hasName + ' on; ' : 'Has no update on; ') + offers[0].name + ' is there, switched off', 'muted'];
  if (c.has) return ['Has ' + c.hasName + '; ' + offers[0].name + ' is newer', 'warn'];
  if (c.other) return ['Has an update XboxUnity doesn’t list for this disc', 'warn'];
  return ['Has no title update for it', 'muted'];
}

// A game's title updates, from XboxUnity, and what each console has of
// them; puts the chosen one on a console (through its queue).
function tuBox(g) {
  if (!g.titleId || !g.mediaId || (g.packages && g.role === 'install')) return [null, null];
  const box = h('div.install-box');
  let data = null, failed = '', loading = false, seen = '';
  async function load(refresh) {
    loading = true; draw();
    try { data = await api('titleupdates?game=' + encodeURIComponent(g.name) + (refresh ? '&refresh=1' : '')); failed = data.error || ''; }
    catch (e) { failed = e.message; }
    loading = false; draw();
  }
  async function put(button, body) {
    button.disabled = true;
    try { const r = await api('titleupdates/install', Object.assign({ game: g.name }, body)); toast(r.queued > 1 ? r.queued + ' consoles get it' : 'It’s on its way'); await refresh(); }
    catch (e) { toast(e.message, true); }
    button.disabled = false;
  }
  async function switchTo(button, address, path) {
    button.disabled = true;
    try { await api(path ? 'titleupdates/use' : 'titleupdates/off', { game: g.name, address, path: path || undefined }); toast(path ? 'Switching it' : 'Turning them off'); await refresh(); }
    catch (e) { toast(e.message, true); button.disabled = false; }
  }
  // Like Aurora's title update manager, for one console: every version of
  // the game's updates, XboxUnity's and those on the console (on, moved
  // aside or in Aurora's store), one line each, newest first, and the one it
  // should use picked from them. A copy on the console is switched to (moved
  // or copied back); one it hasn't got is downloaded here and put on it.
  function managed(c, offers, busy) {
    const where = { live: 'on the console', aside: 'moved aside', aurora: 'in Aurora’s store' };
    const rank = f => f.on ? 3 : f.where === 'aside' ? 2 : 1;  // A copy moved aside is used before Aurora's.
    const lines = new Map();
    for (const f of c.files || []) {
      const key = f.offer || f.contentId || f.path;
      const had = lines.get(key);
      if (!had || rank(f) > rank(had.file)) lines.set(key, { file: f, offer: offers.find(o => o.id === f.offer) });
    }
    for (const o of offers) if (!lines.has(o.id)) lines.set(o.id, { offer: o });
    const number = l => l.file && l.file.version ? l.file.version : l.offer ? l.offer.version : 0;
    const list = [...lines.values()].sort((a, b) => number(b) - number(a));
    const anyOn = list.some(l => l.file && l.file.on);
    return h('div.tu-files',
      list.map(l => {
        const f = l.file, o = l.offer, on = f && f.on;
        const name = number(l) ? 'Title update ' + number(l) : o ? o.name : f.title || f.name;
        const size = (f && f.size) || (o && o.size);
        const about = f ? where[f.where] + (o ? '' : ', not on XboxUnity for this disc') : 'on XboxUnity' + (o.onPc ? ', kept on this computer' : '');
        let action = null;
        if (!on && f) action = h('button.btn.small', { disabled: busy, title: f.where === 'aurora' ? 'Copies it from Aurora’s store to where the game loads it; Aurora’s copy stays' : 'Moves it back to where the game loads it',
          onclick: e => switchTo(e.target, c.address, f.path) }, ic('check', 'sm'), 'Use this one');
        else if (!on) action = h('button.btn.small', { disabled: busy, title: (o.onPc ? 'Sends it' : 'Downloads it here from XboxUnity, checks it, and sends it') + ' over Aurora’s FTP; the update on now moves aside',
          onclick: e => put(e.target, { address: c.address, id: o.id }) }, ic('download', 'sm'), 'Install this one');
        return h('div.install-line',
          h('span', h(on ? 'span.tu-on' : 'span.tu-off', on ? 'On' : f ? 'Off' : 'Not on it'), ' ', h('b', name), o && o === offers[0] ? h('span.muted', ' (newest)') : null,
            h('span.muted', ' · ' + about + (size ? ', ' + bytes(size, 1) : ''))),
          action);
      }),
      h('div.install-line', h('span', h(anyOn ? 'span.tu-off' : 'span.tu-on', anyOn ? 'Off' : 'On'), ' ', h('b', 'None'), h('span.muted', ' · the game as it is on the disc')),
        anyOn ? h('button.btn.small', { disabled: busy, title: 'Moves its updates aside and switches them off in Aurora too; nothing is deleted', onclick: e => switchTo(e.target, c.address, '') }, ic('power', 'sm'), 'Use none') : null));
  }
  async function check(button, address) {
    button.disabled = true;
    try { await api('titleupdates/check', { address }); await refresh(); }
    catch (e) { toast(e.message, true); button.disabled = false; }
  }
  function draw() {
    const head = h('div.install-head', ic('refresh-cw', 'sm'), h('b', 'Title updates'));
    if (!data) { fill(box, head, h('p.muted', loading ? 'Asking XboxUnity…' : failed || '')); return; }
    const offers = data.offers || [];
    if (failed && !offers.length) {
      fill(box, head, h('p', { style: { color: 'var(--bad)' } }, 'Couldn’t ask XboxUnity: ' + failed), h('div.install-actions', h('span.muted', 'XboxUnity is the site Aurora gets title updates from.'), h('button.btn.small', { onclick: () => load(true) }, ic('refresh-cw', 'sm'), 'Try again')));
      return;
    }
    if (!offers.length) {
      fill(box, head, h('p', 'XboxUnity has no title update for this disc (Media ID ' + data.mediaId + ')' + (data.otherDiscs ? ', only for other versions of the game.' : '.')));
      return;
    }
    const queue = S.installs || [];
    const rows = data.consoles.map(c => {
      const busy = queue.some(j => j.address === c.address && (j.state === 'queued' || j.state === 'copying') && (((j.kind === 'update' || j.kind === 'tuoff') && j.game === g.name) || j.kind === 'check'));
      const [text, tone] = busy ? ['Working on it…', 'muted'] : tuState(c, offers);
      return [h('div.install-line', h('span', h('b', c.address), ' ', h('span', { style: { color: tone === 'good' ? 'var(--good)' : tone === 'warn' ? 'var(--warn)' : 'var(--muted)' } }, text), c.hasGame ? null : h('span.muted', ' (no tile of it there)')),
        h('span', { style: { display: 'flex', gap: '6px' } },
          h('button.btn.small', { disabled: busy, title: 'Reads which updates it has, over Aurora’s FTP', onclick: e => check(e.target, c.address) }, ic('scan', 'sm'), 'Check'))),
        managed(c, offers, busy)];
    });
    const withGame = data.consoles.filter(c => c.hasGame).length;
    fill(box, head,
      h('p', ['Newest for this disc on XboxUnity: ', h('b', offers[0].name), offers[0].size ? ' (' + bytes(offers[0].size, 1) + ')' : '', offers[0].onPc ? ', kept on this computer.' : '.',
        ' Pick the one each console uses below. The others move aside (to Hdd1:\\Apps\\NetDisc360\\Title updates), never deleted, so you can switch back.']),
      rows.length ? rows : h('p.muted', 'No console yet.'),
      h('div.install-actions', h('span.muted', 'This computer downloads each update once from XboxUnity, checks it, and sends it over Aurora’s FTP: the consoles never go online for it.'),
        withGame > 1 ? h('button.btn.small', { onclick: e => put(e.target, { all: true, id: offers[0].id }) }, ic('download', 'sm'), 'Newest on all ' + withGame + ' consoles') : null));
  }
  // Loads again when one of its jobs, or a check, has ended.
  function follow() {
    const sign = JSON.stringify((S.installs || []).filter(j => ((j.kind === 'update' || j.kind === 'tuoff') && j.game === g.name) || j.kind === 'check').map(j => [j.id, j.state]));
    if (sign !== seen) { const first = !seen; seen = sign; if (!first && data) load(); }
    if (data) draw();
  }
  seen = JSON.stringify((S.installs || []).filter(j => ((j.kind === 'update' || j.kind === 'tuoff') && j.game === g.name) || j.kind === 'check').map(j => [j.id, j.state]));
  load();
  return [box, follow];
}

// The consoles a game can be started on from here: those with its tile, or
// with it installed.
function playable(g) {
  return S ? S.consoles.filter(c => (g.tiles || []).includes(c.address) || (g.installedOn || []).includes(c.address)) : [];
}

// A Start button for a game a console has: one console starts it there,
// several open its details to pick one.
function startButton(g, tag) {
  const consoles = playable(g);
  if (!consoles.length) return null;
  const title = consoles.length === 1 ? 'Start on ' + consoles[0].address : 'Start on a console';
  const round = tag.includes('.start');
  return h(tag, { title, 'aria-label': title + ': ' + g.name, onclick: e => {
    e.stopPropagation();
    if (consoles.length === 1) playOn(g, consoles[0], e.currentTarget); else details(g);
  }, onkeydown: e => e.stopPropagation() }, ic('play', 'sm'), round ? null : 'Start');
}

async function playOn(g, c, button) {
  if (c.playing && !(await confirmBox('Start ' + g.name + '?', [h('p', { style: { margin: 0 } }, c.address + ' is playing ', h('b', c.mounted), '. Starting ', h('b', g.name), ' quits it.')], 'Start ' + g.name))) return;
  button.disabled = true;
  try { await api('play', { game: g.name, console: c.address }); toast(g.name + ' is starting on ' + c.address); }
  catch (e) { toast(e.message, true); }
  button.disabled = false;
}

function details(g) {
  const on = playing()[g.name.toLowerCase()];
  const folder = S && S.folders[g.folder];
  const [copy, followCopy] = copyBox(g);
  const [updates, followUpdates] = tuBox(g);
  for (const f of [followCopy, followUpdates]) if (f) live.add(f);
  const consoles = playable(g);
  modal(g.name, close => [
    h('div.modal-body', copy, updates, h('div.detail',
      h('div.detail-cover', cover(g)),
      h('div.facts',
        h('div.k', 'Format'), h('div.v', ({ folder: 'Extracted game (folder)', iso: 'ISO disc image', god: 'Games on Demand package' }[g.kind] || g.kind) + (g.xbe ? ', original Xbox' : '')),
        g.xbe ? [h('div.k', 'Emulator'), h('div.v', g.xefu ? g.xefu + (g.xefuWhy ? ': ' + g.xefuWhy : '') : 'The one the console picks')] : null,
        h('div.k', 'Size'), h('div.v', g.sizeKnown ? bytes(g.size, 2) : 'Counting\u2026'),
        h('div.k', 'Title ID'), h('div.v.mono', g.titleId || 'Not known'),
        g.disc ? [h('div.k', 'Disc'), h('div.v', String(g.disc))] : null,
        h('div.k', 'Playing'), h('div.v', on ? on.join(', ') : 'Not now'),
        h('div.k', 'Played'), h('div.v', playedText(g)),

        lines.push(line.text);
        const time = line.text.slice(0, 8), text = line.text.slice(9);

        d.hidden = !matches(line.text);
        box.appendChild(d);
      }
      while (box.children.length > 4000) { box.firstChild.remove(); lines.shift(); }
      last = r.last;
      if (follow) box.scrollTop = box.scrollHeight;
    } catch (e) { /* refresh() reports it */ }
    busy = false;
  }
  return { update: more };
};

// Versions as GitHub tags them: <0, 0 or >0 as a is older than, the same as or
// newer than b ("1.2.0", "v1.10.0", "1.2.0-beta.2"; a pre-release is older than its release).
function versionCompare(a, b) {
  const split = v => { v = String(v || '').replace(/^v/i, '').split('+')[0]; const i = v.indexOf('-'); return [v.slice(0, i < 0 ? v.length : i).split('.').map(n => parseInt(n, 10) || 0), i < 0 ? '' : v.slice(i + 1)]; };
  const [x, px] = split(a), [y, py] = split(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d < 0 ? -1 : 1; }
  if (!px || !py) return px ? -1 : py ? 1 : 0;
  const p = px.split('.'), q = py.split('.');
  for (let i = 0; ; i++) {
    if (i >= p.length || i >= q.length) return Math.sign(p.length - q.length);
    const m = /^\d+$/.test(p[i]), n = /^\d+$/.test(q[i]);
    const d = m && n ? Math.sign(p[i] - q[i]) : m !== n ? (m ? -1 : 1) : p[i] < q[i] ? -1 : p[i] > q[i] ? 1 : 0;
    if (d) return d;
  }
}

// What's known about updates: the server's own check (NetDisc360.exe), or, where
// the server can't reach GitHub (Docker), this browser's, kept for six hours.
let U = null;
const ReleasesApi = 'https://api.github.com/repos/marcusisdahl/NetDisc360/releases?per_page=20';
async function browserCheck(force) {
  const pre = !!S.settings.updatePrerelease;
  try {
    const kept = JSON.parse(store('update') || 'null');
    if (!force && kept && kept.pre === pre && Date.now() - kept.at < 6 * 3600e3) return kept.info;
  } catch (e) { /* checked again */ }
  const info = { checkedAt: 0, error: '', latest: null };
  try {
    const r = await fetch(ReleasesApi, { referrerPolicy: 'no-referrer', headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(r.status === 404 ? 'GitHub has no releases of NetDisc360 to show (404).' : r.status === 403 || r.status === 429 ? 'GitHub turned the check away for now (too many checks from this network). Try again later.' : 'GitHub answered with status ' + r.status + '.');
    const list = (await r.json()).filter(x => !x.draft && /^v?\d/i.test(x.tag_name || '') && (pre || !x.prerelease));
    info.checkedAt = Date.now() / 1000;
    list.sort((a, b) => versionCompare(b.tag_name, a.tag_name));
    if (!list.length) info.error = 'There are no releases on GitHub yet.';
    else {
      info.releases = list.map(x => ({ tag: x.tag_name, version: x.tag_name.replace(/^v/i, ''), name: x.name || '', notes: x.body || '', page: x.html_url, published: x.published_at, prerelease: !!x.prerelease }));
      info.latest = info.releases[0];
    }
  } catch (e) {
    info.error = e instanceof TypeError ? 'This browser couldn\u2019t reach GitHub. Is it online?' : e.message;
  }
  store('update', JSON.stringify({ at: Date.now(), pre, info }));
  return info;
}
// Fills U: the server's, or this browser's check.
async function loadUpdate(force) {
  if (S.update.checks) {
    const r = force ? await api('update/check', {}) : await api('update');
    U = Object.assign({}, r.update, { version: r.version });
  } else {
    const info = await browserCheck(force);
    U = Object.assign({ how: S.update.how, checks: false, installing: false }, info, { version: S.version });
    U.newer = !!(U.latest && versionCompare(U.latest.version, S.version) > 0);
    U.releases = (U.releases || []).map(r => Object.assign({}, r, { newer: versionCompare(r.version, S.version) > 0 }));
  }
  return U;
}
// Whether there's a newer version, for the sidebar and the dashboard.
function updateOut() {
  if (!S || !S.settings.updateCheck && !(U && U.newer)) return null;
  if (S.update.checks) return S.update.newer ? S.update.latest.version : null;
  return U && U.newer ? U.latest.version : null;
}

// The update this version came with, for a few days after it, until its changes were seen.
function justUpdated() {
  const last = S && S.update.history && S.update.history[0];
  if (!last || last.version !== S.version || (last.how !== 'app' && last.how !== 'other') || Date.now() / 1000 - last.at > 7 * 86400) return null;
  return store('seen-update') === last.version ? null : last;
}

// Release notes: GitHub's Markdown, its headings, lists, bold, code and links, as text.
function markdown(text) {
  const inline = line => {
    const out = [];
    const re = /\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s)]+)/g;
    let at = 0, m;
    while ((m = re.exec(line))) {
      if (m.index > at) out.push(line.slice(at, m.index));
      if (m[1]) out.push(h('b', m[1]));
      else if (m[2]) out.push(h('code', m[2]));
      else { const url = m[4] || m[5]; out.push(h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, m[3] || url.replace(/^https:\/\/github\.com\/[^/]+\/[^/]+\/(pull|issues)\/(\d+)$/, '#$2'))); }
      at = re.lastIndex;
    }
    if (at < line.length) out.push(line.slice(at));
    return out;
  };
  const nodes = [];
  let list = null, para = null;
  for (const raw of String(text || '').replace(/\r/g, '').split('\n')) {
    const line = raw.trim();
    const head = line.match(/^(#{1,4})\s+(.*)$/), item = line.match(/^[-*+]\s+(.*)$/);
    if (!line || head || item) para = null;
    if (!item) list = null;
    if (!line || /^!\[/.test(line) || /^<!--/.test(line)) continue;
    if (head) nodes.push(h(head[1].length <= 2 ? 'h3' : 'h4', inline(head[2])));
    else if (item) { if (!list) nodes.push(list = h('ul')); list.appendChild(h('li', inline(item[1]))); }
    else if (para) para.append(' ', ...inline(line));
    else nodes.push(para = h('p', inline(line)));
  }
  return nodes.length ? nodes : [h('p.muted', 'This release has no notes.')];
}

// Waits for the server to come back after a restart, then loads its page.
let restarting = false;
function awaitRestart(text) {
  if (restarting) return;
  restarting = true;
  store('restarted', text);
  let tries = 0;
  const before = S && S.uptime;
  const look = async () => {
    try {
      const r = await fetch('/api/state', { headers: { 'X-NetDisc': '1' } });
      if (r.ok || r.status === 401) {
        const st = r.ok ? await r.json() : null;
        if (!st || st.uptime < before || st.version !== S.version) { location.reload(); return; }
      }
    } catch (e) { /* not back yet */ }
    if (++tries < 120) setTimeout(look, 1000);
    else { restarting = false; toast('NetDisc360 didn\u2019t come back. Start it again from its folder or the Start menu.', true); }
  };
  setTimeout(look, 2000);
}

// Asks before something that can't be undone; true for ok.
function confirmBox(title, text, ok, danger) {
  return new Promise(done => {
    let yes = false;
    modal(title, close => [
      h('div.modal-body', text),
      h('div.modal-foot', h('span.note'), h('button.btn', { onclick: close }, 'Cancel'),
        h('button.btn' + (danger ? '.danger' : '.primary'), { onclick: () => { yes = true; close(); } }, ok)),
    ], true, () => done(yes));
  });
}

function restoreBackup(f) {
  if (f.size > 180 * 1024) { toast('That file is too big to be NetDisc360\u2019s settings.', true); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const a = new Uint8Array(reader.result);
    let text = '';
    for (let i = 0; i < a.length; i += 0x8000) text += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
    try {
      const r = await api('restore', { file: btoa(text) });
      await finishWizard(true);
      toast('Settings restored');
      if (r.notes.length) modal('Settings restored', close => [h('div.modal-body', h('p', { style: { marginTop: 0 } }, 'A few things to know:'), h('ul', r.notes.map(n => h('li', n)))), h('div.modal-foot', h('span.note'), h('button.btn.primary', { onclick: close }, 'OK'))], true);
    } catch (e) { toast(e.message, true); }
  };
  reader.readAsArrayBuffer(f);
}
