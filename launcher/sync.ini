; NetISO Sync settings. Sync makes a game folder in games= for each ISO on
; the NetISO server, and removes the folders of ISOs that are gone.
;
; server: the NetISO server's IP address (optionally :port). Without it, Sync
; reads the plugin's netiso.xex.txt from the root of Hdd1: or Usb0:.
;server=192.168.1.20
;
; games: where the game folders go. Add this folder to Aurora's scan paths
; with depth 1. When it's on Hdd1:, the helper the game folders share goes in
; Hdd1:\Apps\NetDisc360, as NetDisc360 on the PC puts it.
games=Hdd1:\NetDisc360\Games
;
; after: what to start when Sync is done. Without it, the dashboard starts.
; If Sync is DashLaunch's Default (so it runs at every boot), this must be
; Aurora itself, or Sync would start itself again.
;after=Hdd1:\Aurora\Aurora.xex
